# E2E override: makes all site_url() calls generate http://app/ (Docker-internal) URLs
# by default so that server-side 302 redirects are reachable from Playwright. With
# scripts/e2e.sh --keep, E2E_APP_BASE_URL is changed only after the automated run
# and the app container is recreated for review from the host browser.
#
# IMPORTANT: do NOT set CI_ENVIRONMENT=testing here. That would cause CodeIgniter's
# Database config to switch defaultGroup to 'tests' (SQLite3), breaking all DB queries.
#
# Dedicated E2E database: the app is redirected to `kermesse_e2e` so that the E2E
# runner can drop and recreate it freely without touching the local dev/staging `kermesse`
# database that may contain in-progress data.
#
# Decoupling from local dev stack:
#   Set KERMESSE_HTTP_PORT to a free port before running scripts/e2e.sh so that the
#   E2E app does not conflict with the staging stack on 8080:
#     KERMESSE_HTTP_PORT=8085 bash scripts/e2e.sh --keep
#   Then browse the E2E environment at http://localhost:8085/
#
# Usage (via scripts/e2e.sh):
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml ...
services:
  app:
    environment:
      app.baseURL: "${E2E_APP_BASE_URL:-http://app/}"
      kermesse.publicBaseURL: "${E2E_APP_BASE_URL:-http://app/}"
      database.default.database: "kermesse_e2e"
      # Disable CI4 Debug Bar: its XHR gets rewritten by page.route() in Playwright,
      # causing the toolbar JSON (with SQL queries/routes) to be injected into the DOM
      # and break page.content() PII assertions.
      # 'production' disables the Toolbar (ENVIRONMENT check) without switching DB to
      # SQLite (which only happens with CI_ENVIRONMENT=testing).
      CI_ENVIRONMENT: "production"
