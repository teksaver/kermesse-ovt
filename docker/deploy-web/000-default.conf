<VirtualHost *:80>
    # Rehearsal deploy-web: document root is httpdocs/ on the deploy-target-data volume.
    # Mirrors the Ouvaton layout where httpdocs/ is the web root served by Apache.
    DocumentRoot /srv/deploy-data/httpdocs

    <Directory /srv/deploy-data/httpdocs>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Allow PHP to follow symlinks from httpdocs/ into releases/ via current/.
    <Directory /srv/deploy-data>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
