; Limites runtime alignées sur la cible Ouvaton (parité local ⇄ production, NFR-4).
;
; Monté dans le conteneur `app` en `conf.d/zz-kermesse.ini` : le préfixe `zz-`
; garantit un chargement APRÈS les .ini de l'image, donc ces valeurs écrasent
; les défauts PHP.
;
; Valeurs = points de départ documentés (PRD infra FR-3), à recalibrer sur la
; sortie de `/ops/probe` une fois la mesure Ouvaton enregistrée. Tout écart
; confirmé doit être reporté dans docs/deployment-ouvaton.md
; (section « Écarts local ⇄ Ouvaton »).

memory_limit = 128M
max_execution_time = 30
max_input_time = 30
post_max_size = 8M
upload_max_filesize = 8M

; Aligné sur app.appTimezone (Europe/Paris) pour éviter les warnings date/heure.
date.timezone = Europe/Paris
