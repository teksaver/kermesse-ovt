name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Gate 1 : PHPUnit (SQLite) ────────────────────────────────────────────
  validate-and-test:
    runs-on: ubuntu-latest

    env:
      PHP_VERSION: '8.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, intl, json, mysqli, sqlite3
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit (SQLite)
        run: composer test:sqlite

  # ─── Gate 2 : PHPStan static analysis ────────────────────────────────────
  phpstan:
    runs-on: ubuntu-latest

    env:
      PHP_VERSION: '8.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, intl, json, mysqli, sqlite3
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan (level 5, with baseline)
        run: composer analyse

  # ─── Gate 3 : MariaDB schema validation + PHPUnit (MariaDB) ──────────────
  validate-mariadb:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
          MARIADB_DATABASE: kermesse_test
          MARIADB_USER: kermesse_ci
          MARIADB_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s

    env:
      PHP_VERSION: '8.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, intl, json, mysqli, sqlite3
          coverage: none

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Validate SQL migrations against MariaDB
        run: |
          for sql_file in database/migrations_sql/*.sql; do
            if [ -f "$sql_file" ]; then
              echo "Applying: $sql_file"
              mysql -h 127.0.0.1 -u kermesse_ci -pci_password kermesse_test < "$sql_file"
            fi
          done
          echo "All SQL migrations applied successfully."

      - name: Verify schema tables exist
        run: |
          TABLES=$(mysql -h 127.0.0.1 -u kermesse_ci -pci_password kermesse_test -N -e "SHOW TABLES;")
          for expected in schema_versions ops_nonces kermesses access_tokens email_events stands slots slot_signups users kermesse_user_roles; do
            if echo "$TABLES" | grep -qw "$expected"; then
              echo "✓ Table $expected exists"
            else
              echo "✗ Table $expected is MISSING"
              exit 1
            fi
          done
          # Story 6.10 AC5 — la bascule stateless (20260617) supprime profile_divergences
          # et le renommage (20260620) remplace signups par slot_signups : les deux
          # anciennes tables doivent être ABSENTES après la stack complète de migrations.
          for forbidden in profile_divergences signups; do
            if echo "$TABLES" | grep -qw "$forbidden"; then
              echo "✗ Table $forbidden should NOT exist after migrations"
              exit 1
            else
              echo "✓ Table $forbidden is absent (expected)"
            fi
          done

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run MariaDB integration tests
        # La connexion MySQLi est injectée via phpunit.mariadb.xml (<php><env>)
        # et non via des variables d'env shell : CI4 BaseConfig::getEnvValue() lit
        # $_ENV/$_SERVER, jamais getenv(). PHP ne peuple pas $_ENV avec les noms
        # contenant des points (database.tests.*). PHPUnit <env> peuple bien $_ENV.
        run: composer test:mariadb

      - name: Dump MariaDB logs on failure
        if: failure()
        run: docker ps -a -q --filter ancestor=mariadb:10.11 | xargs -r docker logs 2>&1 || true

  # ─── Gate 4 : Playwright E2E — smoke tests (6.3) + parcours critiques ─────
  #
  # Runs the three Story-6.3 smoke regressions (add-slot, participations, team)
  # and the full critical-path suite (6.4/6.5) via Docker Compose, matching the
  # local `bash scripts/e2e.sh` flow.
  # retries: 0 in playwright.config.ts ensures flakiness is visible, not silenced.
  e2e-playwright:
    runs-on: ubuntu-latest
    needs: [validate-and-test, validate-mariadb]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Playwright E2E tests (Docker Compose)
        run: bash scripts/e2e.sh

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ─── Gate 5 : Package deploy artifact ────────────────────────────────────
  #
  # Runs only on main branch or PRs targeting main.
  # Must complete BEFORE deploy-rehearsal so the rehearsal uses the exact packaged artifact.
  # The artifact excludes Node, Playwright, tests, traces, and dev deps (AC8).
  #
  # Required checks for branch protection on main:
  #   validate-and-test, phpstan, validate-mariadb, e2e-playwright, deploy-rehearsal, package-artifact
  package-artifact:
    runs-on: ubuntu-latest
    needs: [validate-and-test, validate-mariadb, phpstan, e2e-playwright]
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'

    env:
      PHP_VERSION: '8.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, intl, json, mysqli, sqlite3
          coverage: none

      - name: Run packaging script
        run: bash scripts/package-deploy-artifact.sh

      - name: Generate release candidate manifest
        id: rc-manifest
        run: |
          set -euo pipefail
          ARCHIVE_SHA256="$(awk '{print $1}' build/kermesse-deploy.tar.gz.sha256)"
          TIMESTAMP_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > build/kermesse-deploy-manifest.json <<EOF
          {
            "commit_sha": "${{ github.sha }}",
            "ci_run_id": "${{ github.run_id }}",
            "artifact_name": "kermesse-deploy",
            "archive_sha256": "${ARCHIVE_SHA256}",
            "php_version": "${{ env.PHP_VERSION }}",
            "timestamp_utc": "${TIMESTAMP_UTC}"
          }
          EOF
          echo "Manifeste RC généré :"
          cat build/kermesse-deploy-manifest.json
          echo "archive_sha256=${ARCHIVE_SHA256}" >> "${GITHUB_OUTPUT}"

      - name: Verify deploy artifact public extraction
        run: |
          set -euo pipefail
          ( cd build && sha256sum -c kermesse-deploy.tar.gz.sha256 )
          tar -tzf build/kermesse-deploy.tar.gz | awk '
            {
              path = $0
              sub(/^\.\//, "", path)
              sub(/\/$/, "", path)
              if (path == "public" || index(path, "public/") == 1) found = 1
            }
            END { exit found ? 0 : 1 }
          '
          rm -rf deploy-staging
          mkdir -p deploy-staging
          tar -xzf build/kermesse-deploy.tar.gz -C deploy-staging public
          test -f deploy-staging/public/.htaccess
          test -f deploy-staging/public/index.php

      - name: Verify artifact excludes dev dependencies
        run: |
          set -euo pipefail
          # Ensure Node, Playwright, PHPUnit tests and dev assets are not in the artifact
          for forbidden in node_modules e2e playwright-report test-results tests; do
            if tar -tzf build/kermesse-deploy.tar.gz | grep -qE "(^|\/)${forbidden}(\/|$)"; then
              echo "::error::Artefact contient un dossier interdit: ${forbidden}"
              exit 1
            fi
          done
          echo "Artefact propre — aucune dépendance de développement incluse."

      - name: Upload main deploy artifact
        if: github.ref == 'refs/heads/main'
        id: upload-main-artifact
        uses: actions/upload-artifact@v4
        with:
          name: kermesse-deploy
          path: |
            build/kermesse-deploy.tar.gz
            build/kermesse-deploy.tar.gz.sha256
            build/kermesse-deploy-manifest.json
          retention-days: 14

      - name: Record artifact identity
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ARCHIVE_SHA256="${{ steps.rc-manifest.outputs.archive_sha256 }}"
          cat > build/rc-identity.json <<EOF
          {
            "artifact_id": "${{ steps.upload-main-artifact.outputs.artifact-id }}",
            "artifact_url": "${{ steps.upload-main-artifact.outputs.artifact-url }}",
            "artifact_digest": "${{ steps.upload-main-artifact.outputs.artifact-digest }}",
            "archive_sha256": "${ARCHIVE_SHA256}",
            "commit_sha": "${{ github.sha }}",
            "ci_run_id": "${{ github.run_id }}"
          }
          EOF
          echo "RC identity:"
          cat build/rc-identity.json

      - name: Upload pull request deploy artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: kermesse-deploy-pr-${{ github.event.pull_request.number }}
          path: |
            build/kermesse-deploy.tar.gz
            build/kermesse-deploy.tar.gz.sha256
            build/kermesse-deploy-manifest.json
          retention-days: 7

  # ─── Gate 6 : Deploy rehearsal ────────────────────────────────────────────
  #
  # Runs only on main branch or PRs targeting main (same condition as package-artifact).
  # Depends on package-artifact to rehearse the EXACT packaged binary, not a rebuilt artifact.
  deploy-rehearsal:
    runs-on: ubuntu-latest
    needs: [validate-and-test, validate-mariadb, phpstan, e2e-playwright, package-artifact]
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start rehearsal environment
        run: docker compose --profile rehearsal up -d

      - name: Wait for deploy-web to be ready
        run: |
          timeout 300 bash -c '
            while true; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8081/ 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ]; then break; fi
              echo "deploy-web not ready (HTTP_CODE=$HTTP_CODE), retrying..."
              sleep 5
            done
          '

      - name: Download packaged artifact for rehearsal
        uses: actions/download-artifact@v4
        with:
          name: kermesse-deploy
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: build/

      - name: Run deploy rehearsal
        env:
          TARGET_HOST: deploy-target
          TARGET_PORT: "22"
          TARGET_PROTO: sftp
          TARGET_USER: deploy
          TARGET_PASS: deploy_rehearsal
          REMOTE_STAGING: staging
          BASE_URL: "http://deploy-web"
          OPS_HMAC_SECRET: local_dev_ops_secret_32_bytes_minimum
          TARGET_SFTP_SKIP_HOST_CHECK: "true"
        run: bash scripts/deploy-rehearsal.sh --use-existing-artifact

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose --profile rehearsal logs --no-color 2>&1 || true

      - name: Teardown environment
        if: always()
        run: docker compose --profile rehearsal down --volumes 2>&1 || true

      - name: Upload RC evidence placeholder
        # Publie le manifeste et l'identité RC comme point d'ancrage des preuves RC.
        # Les preuves complètes (smoke tests, rehearsal log) sont générées par
        # scripts/qualify-release-candidate.sh et archivées séparément.
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: rc-evidence-${{ github.run_id }}
          path: |
            build/kermesse-deploy-manifest.json
            build/rc-identity.json
          retention-days: 30
