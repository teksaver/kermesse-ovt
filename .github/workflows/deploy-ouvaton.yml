name: Deploy to Ouvaton

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build-and-package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    env:
      PHP_VERSION: '8.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          successful_runs="$(gh run list \
            --workflow CI \
            --commit "$GITHUB_SHA" \
            --branch main \
            --status success \
            --json databaseId \
            --jq 'length')"

          if [ "$successful_runs" -lt 1 ]; then
            echo "::error::No successful CI run found for ${GITHUB_SHA} on main. Run CI before deploying."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, intl, json, mysqli, sqlite3
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies (with dev for tests)
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --exclude-group mariadb

      # --- Packaging ---
      - name: Run packaging script
        run: bash scripts/package-deploy-artifact.sh

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: kermesse-deploy
          path: build/kermesse-deploy.zip
          retention-days: 14

  deploy:
    needs: build-and-package
    runs-on: ubuntu-latest
    environment: production
    # Le deploiement reste desactive tant que le protocole et les identifiants Ouvaton ne sont pas confirmes.
    # Retirer la condition 'if: false' une fois les secrets OUVATON_DEPLOY_* configures.
    if: false

    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: kermesse-deploy

      - name: Extract artifact
        run: |
          mkdir -p deploy-staging
          unzip kermesse-deploy.zip -d deploy-staging

      # Emplacement reserve pour l'etape d'envoi distant.
      # La methode de transfert exacte depend des capacites du compte Ouvaton :
      #   - FTPS : utiliser lftp ou une action de transfert fichier compatible
      #   - SFTP : utiliser un transfert fichier SFTP, sans shell distant ni rsync
      #
      # Secrets GitHub requis, a configurer dans l'environnement 'production' :
      #   OUVATON_DEPLOY_PROTOCOL  - ftp, ftps ou sftp
      #   OUVATON_DEPLOY_HOST      - nom d'hote du serveur Ouvaton
      #   OUVATON_DEPLOY_USERNAME  - identifiant du compte Ouvaton
      #   OUVATON_DEPLOY_PASSWORD  - mot de passe ou cle SSH du compte Ouvaton
      #   OUVATON_DEPLOY_REMOTE_PATH - chemin distant sur Ouvaton, par exemple /www/kermesse
      #
      # IMPORTANT : l'etape de deploiement applicatif ne doit jamais ecraser le .env de production.
      # Le .env de production est gere par .github/workflows/sync-production-env.yml.
      # L'application deployee se connecte a la MariaDB managée Ouvaton via database.default.*
      # dans ce .env ; ce workflow ne cree pas et n'administre pas la base de production.
      #
      # Post-deploiement : appeler POST /ops/migrate avec authentification HMAC
      # une fois l'etape de deploiement applicatif activee. Cet appel vise l'application
      # Ouvaton deployee, qui utilise la connexion MariaDB managée configuree dans .env.
      # Voir docs/migration-runner.md pour le payload signe et les en-tetes requis.
      - name: Deploy to Ouvaton (placeholder)
        run: |
          echo "================================================================="
          echo "DEPLOY STEP: Not yet activated."
          echo "Ouvaton protocol, host, and credentials must be confirmed first."
          echo "See docs/deployment-ouvaton.md for setup instructions."
          echo "================================================================="
          exit 1

      - name: Run post-deploy migrations
        env:
          BASE_URL: ${{ secrets.KERMESSE_PUBLIC_BASE_URL }}
          OPS_MIGRATION_HMAC_SECRET: ${{ secrets.OPS_MIGRATION_HMAC_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$BASE_URL" ] || [ -z "$OPS_MIGRATION_HMAC_SECRET" ]; then
            echo "::error::BASE_URL and OPS_MIGRATION_HMAC_SECRET are required."
            exit 1
          fi

          if [ "${BASE_URL#https://}" = "$BASE_URL" ]; then
            echo "::error::BASE_URL must start with https:// for production migrations."
            exit 1
          fi

          if [ "${#OPS_MIGRATION_HMAC_SECRET}" -lt 32 ]; then
            echo "::error::OPS_MIGRATION_HMAC_SECRET must be at least 32 characters."
            exit 1
          fi

          BODY='{}'
          TIMESTAMP="$(date +%s)"
          NONCE="$(openssl rand -hex 16)"
          BODY_HASH="$(printf '%s' "$BODY" | sha256sum | cut -d' ' -f1)"
          PAYLOAD="$(printf '%s\n%s\nPOST\nops/migrate\n%s' "$TIMESTAMP" "$NONCE" "$BODY_HASH")"
          SIGNATURE="$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$OPS_MIGRATION_HMAC_SECRET" | cut -d' ' -f2)"

          curl -fsS -X POST "${BASE_URL%/}/ops/migrate" \
            -H "Content-Type: application/json" \
            -H "X-Kermesse-Timestamp: ${TIMESTAMP}" \
            -H "X-Kermesse-Nonce: ${NONCE}" \
            -H "X-Kermesse-Signature: ${SIGNATURE}" \
            -d "$BODY"
