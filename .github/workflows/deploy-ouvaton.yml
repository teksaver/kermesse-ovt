name: Deploy to Ouvaton

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'Run ID of a successful CI run on main (required for manual dispatch)'
        required: true
        type: string
      expected_sha:
        description: 'Expected commit SHA — optional but recommended for extra safety'
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  download-and-verify:
    # Auto-deploy only when CI succeeds on main AND operator has explicitly set DEPLOY_PRODUCTION_GO=true.
    # Manual dispatch is always allowed (operator must set the Go explicitly via workflow_dispatch).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       vars.DEPLOY_PRODUCTION_GO == 'true')
    runs-on: ubuntu-latest
    environment: production

    outputs:
      archive_sha256: ${{ steps.verify-manifest.outputs.archive_sha256 }}
      candidate_sha: ${{ steps.verify-manifest.outputs.candidate_sha }}
      ci_run_id: ${{ steps.resolve-run-id.outputs.ci_run_id }}

    steps:
      - name: Checkout scripts at candidate SHA
        uses: actions/checkout@v4
        with:
          # Checkout the candidate commit (not the HEAD that triggered this workflow).
          # For workflow_run: head_sha of the triggering CI run.
          # For workflow_dispatch: the SHA resolved from the provided ci_run_id (verified below).
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Resolve CI run ID
        id: resolve-run-id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            CI_RUN_ID="${{ github.event.workflow_run.id }}"
            EXPECTED_SHA="${{ github.event.workflow_run.head_sha }}"
            echo "Triggered by CI run ${CI_RUN_ID} on SHA ${EXPECTED_SHA}"
          else
            CI_RUN_ID="${{ inputs.ci_run_id }}"
            EXPECTED_SHA="${{ inputs.expected_sha }}"

            # Validate the provided run ID corresponds to a successful CI run on main.
            RUN_INFO="$(gh run view "${CI_RUN_ID}" --json headBranch,headSha,conclusion,workflowName)"
            RUN_CONCLUSION="$(echo "${RUN_INFO}" | jq -r '.conclusion')"
            RUN_BRANCH="$(echo "${RUN_INFO}" | jq -r '.headBranch')"
            RUN_WORKFLOW="$(echo "${RUN_INFO}" | jq -r '.workflowName')"
            RUN_SHA="$(echo "${RUN_INFO}" | jq -r '.headSha')"

            if [ "${RUN_CONCLUSION}" != "success" ]; then
              echo "::error::CI run ${CI_RUN_ID} did not succeed (conclusion=${RUN_CONCLUSION}). Only successful runs may be promoted."
              exit 1
            fi
            if [ "${RUN_BRANCH}" != "main" ]; then
              echo "::error::CI run ${CI_RUN_ID} is from branch '${RUN_BRANCH}', not 'main'. Only main branch runs may be promoted."
              exit 1
            fi
            if [ "${RUN_WORKFLOW}" != "CI" ]; then
              echo "::error::Run ${CI_RUN_ID} is workflow '${RUN_WORKFLOW}', not 'CI'. Only CI workflow runs may be promoted."
              exit 1
            fi

            # If operator provided an expected SHA, verify it matches.
            if [ -n "${EXPECTED_SHA}" ] && [ "${RUN_SHA}" != "${EXPECTED_SHA}" ]; then
              echo "::error::CI run ${CI_RUN_ID} is for SHA ${RUN_SHA} but expected_sha=${EXPECTED_SHA}. Refusing to promote."
              exit 1
            fi

            EXPECTED_SHA="${RUN_SHA}"
            echo "Manual dispatch: CI run ${CI_RUN_ID} validated — SHA ${EXPECTED_SHA}, conclusion=${RUN_CONCLUSION}"
          fi

          echo "ci_run_id=${CI_RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "expected_sha=${EXPECTED_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Download qualified CI artifact
        uses: actions/download-artifact@v4
        with:
          name: kermesse-deploy
          run-id: ${{ steps.resolve-run-id.outputs.ci_run_id }}
          github-token: ${{ github.token }}
          # Deposit files into build/ — the location expected by transfer-archive.sh and deploy steps.
          path: build

      - name: Verify manifest and archive identity
        id: verify-manifest
        env:
          EXPECTED_SHA: ${{ steps.resolve-run-id.outputs.expected_sha }}
          CI_RUN_ID: ${{ steps.resolve-run-id.outputs.ci_run_id }}
        run: |
          set -euo pipefail

          MANIFEST="build/kermesse-deploy-manifest.json"
          if [ ! -f "${MANIFEST}" ]; then
            echo "::error::Manifeste RC absent de l'artefact téléchargé (${MANIFEST}). Ce run CI ne contient pas de manifeste."
            exit 1
          fi

          echo "Contenu du manifeste :"
          cat "${MANIFEST}"

          MANIFEST_SHA="$(jq -r '.commit_sha' "${MANIFEST}")"
          MANIFEST_RUN_ID="$(jq -r '.ci_run_id' "${MANIFEST}")"
          MANIFEST_ARCHIVE_SHA256="$(jq -r '.archive_sha256' "${MANIFEST}")"
          MANIFEST_ARTIFACT_NAME="$(jq -r '.artifact_name' "${MANIFEST}")"

          # Verify artifact_name matches the expected artifact identifier.
          if [ "${MANIFEST_ARTIFACT_NAME}" != "kermesse-deploy" ]; then
            echo "::error::artifact_name inattendu dans le manifeste : '${MANIFEST_ARTIFACT_NAME}' (attendu : 'kermesse-deploy')."
            exit 1
          fi

          # Verify commit SHA matches the triggering CI run.
          if [ -n "${EXPECTED_SHA}" ] && [ "${MANIFEST_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Manifeste SHA (${MANIFEST_SHA}) ≠ SHA attendu (${EXPECTED_SHA}). Promotion refusée."
            exit 1
          fi

          # Verify run ID in manifest matches the run we downloaded from.
          if [ "${MANIFEST_RUN_ID}" != "${CI_RUN_ID}" ]; then
            echo "::error::Manifeste run_id (${MANIFEST_RUN_ID}) ≠ run téléchargé (${CI_RUN_ID}). Incohérence détectée."
            exit 1
          fi

          # Verify archive checksum.
          ( cd build && sha256sum -c kermesse-deploy.tar.gz.sha256 ) || { echo "::error::Artefact corrompu — checksum invalide."; exit 1; }

          # Verify sidecar checksum matches manifest value.
          SIDECAR_SHA256="$(awk '{print $1}' build/kermesse-deploy.tar.gz.sha256)"
          if [ "${MANIFEST_ARCHIVE_SHA256}" != "${SIDECAR_SHA256}" ]; then
            echo "::error::SHA256 du manifeste (${MANIFEST_ARCHIVE_SHA256}) ≠ sidecar (${SIDECAR_SHA256}). Archive substituée ou corrompue."
            exit 1
          fi

          echo "Identité RC vérifiée :"
          echo "  Commit SHA    : ${MANIFEST_SHA}"
          echo "  CI Run ID     : ${MANIFEST_RUN_ID}"
          echo "  Archive SHA256: ${MANIFEST_ARCHIVE_SHA256}"
          echo "  Artifact name : ${MANIFEST_ARTIFACT_NAME}"

          echo "archive_sha256=${MANIFEST_ARCHIVE_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "candidate_sha=${MANIFEST_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Extract public assets for httpdocs deployment
        run: |
          set -euo pipefail
          mkdir -p deploy-staging
          tar -xzf build/kermesse-deploy.tar.gz -C deploy-staging public \
            || tar -xzf build/kermesse-deploy.tar.gz -C deploy-staging ./public

  deploy:
    needs: download-and-verify
    runs-on: ubuntu-latest
    environment: production

    env:
      # Variables (non-sensitive) — only what the deploy steps actually use.
      # Database, email, token, and session vars have been removed: the deploy
      # job no longer generates a .env file (NFR-2). The .env lives in shared/
      # and is managed by sync-production-env.yml.
      OUVATON_DEPLOY_HOST: ${{ vars.OUVATON_DEPLOY_HOST }}
      OUVATON_DEPLOY_USERNAME: ${{ vars.OUVATON_DEPLOY_USERNAME }}
      OUVATON_DEPLOY_REMOTE_FOLDER: ${{ vars.OUVATON_DEPLOY_REMOTE_FOLDER }}
      OUVATON_HTTPDOCS_FOLDER: ${{ vars.OUVATON_HTTPDOCS_FOLDER }}
      KERMESSE_PUBLIC_BASE_URL: ${{ vars.KERMESSE_PUBLIC_BASE_URL }}
      KERMESSE_ALLOW_INSECURE_TLS: ${{ vars.KERMESSE_ALLOW_INSECURE_TLS }}
      # Secrets (sensitive credentials)
      OUVATON_DEPLOY_PASSWORD: ${{ secrets.OUVATON_DEPLOY_PASSWORD }}
      OUVATON_SFTP_KNOWN_HOST: ${{ secrets.OUVATON_SFTP_KNOWN_HOST }}
      # Le secret HMAC est injecté au niveau des étapes webhook (sous le nom OPS_HMAC_SECRET
      # attendu par scripts/lib/ops-sign.sh), pas au niveau du job.

    steps:
      - name: Checkout scripts at candidate SHA
        # Checkout the exact candidate commit so that all deployment scripts (transfer-archive.sh,
        # deploy-httpdocs.sh, sync-production-env.sh, ops-sign.sh, …) match the promoted artifact.
        # Never fall back to HEAD implicitly when the candidate differs.
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.download-and-verify.outputs.candidate_sha }}
          persist-credentials: false

      - name: Vérifier les préconditions Go/No-Go
        # STORY_610_DONE doit être positionné à 'true' dans GitHub vars après validation de Story 6.10.
        # Ce blocage est intentionnel : un déploiement sans 6.10 terminée est interdit.
        run: |
          set -euo pipefail
          if [ "${STORY_610_DONE:-false}" != "true" ]; then
            echo "::error::STORY_610_DONE n'est pas positionné à 'true'. La Story 6.10 doit être terminée et validée avant tout déploiement en production."
            echo "::error::Positionner vars.STORY_610_DONE = 'true' dans les paramètres GitHub de l'environnement production après validation de Story 6.10."
            exit 1
          fi
          echo "Précondition Go/No-Go validée : STORY_610_DONE=true"
        env:
          STORY_610_DONE: ${{ vars.STORY_610_DONE }}

      - name: Install transfer client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Configure SFTP known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${OUVATON_SFTP_KNOWN_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ensure production .env exists for first install
        env:
          SYNC_ENV_MODE: ensure-present
          KERMESSE_OUVATON_ROOT: ${{ vars.KERMESSE_OUVATON_ROOT }}
          KERMESSE_DATABASE_HOSTNAME: ${{ vars.KERMESSE_DATABASE_HOSTNAME }}
          KERMESSE_DATABASE_DATABASE: ${{ vars.KERMESSE_DATABASE_DATABASE }}
          KERMESSE_DATABASE_USERNAME: ${{ vars.KERMESSE_DATABASE_USERNAME }}
          KERMESSE_EMAIL_SMTP_HOST: ${{ vars.KERMESSE_EMAIL_SMTP_HOST }}
          KERMESSE_EMAIL_SMTP_USER: ${{ vars.KERMESSE_EMAIL_SMTP_USER }}
          KERMESSE_EMAIL_FROM_EMAIL: ${{ vars.KERMESSE_EMAIL_FROM_EMAIL }}
          KERMESSE_APP_TIMEZONE: ${{ vars.KERMESSE_APP_TIMEZONE }}
          KERMESSE_EMAIL_FROM_NAME: ${{ vars.KERMESSE_EMAIL_FROM_NAME }}
          KERMESSE_EMAIL_SMTP_PORT: ${{ vars.KERMESSE_EMAIL_SMTP_PORT }}
          KERMESSE_EMAIL_SMTP_CRYPTO: ${{ vars.KERMESSE_EMAIL_SMTP_CRYPTO }}
          KERMESSE_OPS_PROBE_ENABLED: ${{ vars.KERMESSE_OPS_PROBE_ENABLED }}
          KERMESSE_DATABASE_PASSWORD: ${{ secrets.KERMESSE_DATABASE_PASSWORD }}
          KERMESSE_EMAIL_SMTP_PASS: ${{ secrets.KERMESSE_EMAIL_SMTP_PASS }}
          KERMESSE_TOKEN_SECRET: ${{ secrets.KERMESSE_TOKEN_SECRET }}
          OPS_MIGRATION_HMAC_SECRET: ${{ secrets.OPS_MIGRATION_HMAC_SECRET }}
        run: bash scripts/sync-production-env.sh

      - name: Download qualified CI artifact
        uses: actions/download-artifact@v4
        with:
          name: kermesse-deploy
          run-id: ${{ needs.download-and-verify.outputs.ci_run_id }}
          github-token: ${{ github.token }}
          # Dépose l'archive dans build/ — emplacement attendu par scripts/transfer-archive.sh.
          path: build

      - name: Verify artifact identity before deploy
        env:
          EXPECTED_SHA256: ${{ needs.download-and-verify.outputs.archive_sha256 }}
          EXPECTED_CANDIDATE_SHA: ${{ needs.download-and-verify.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          # Re-verify the checksum after download into the deploy job — ensures the artifact
          # was not swapped between jobs. The manifest check in download-and-verify already
          # validated identity; this is a lightweight second confirmation before any write.
          ( cd build && sha256sum -c kermesse-deploy.tar.gz.sha256 ) || { echo "::error::Artefact corrompu à l'étape de déploiement."; exit 1; }
          ACTUAL_SHA256="$(awk '{print $1}' build/kermesse-deploy.tar.gz.sha256)"
          if [ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::SHA256 du déploiement (${ACTUAL_SHA256}) ≠ SHA256 validé en qualification (${EXPECTED_SHA256}). Promotion refusée."
            exit 1
          fi
          echo "Archive identité confirmée : SHA256=${ACTUAL_SHA256} pour commit ${EXPECTED_CANDIDATE_SHA}"
          mkdir -p deploy-staging
          # Extract only the public directory needed for static assets.
          tar -xzf build/kermesse-deploy.tar.gz -C deploy-staging public \
            || tar -xzf build/kermesse-deploy.tar.gz -C deploy-staging ./public

      - name: Upload archive to staging
        # Réutilise EXACTEMENT le script validé en répétition (locale + job CI deploy-rehearsal)
        # au lieu de réimplémenter lftp inline : la parité FR-18 couvre désormais le transfert
        # de production. put (jamais mirror) ; le .env de prod n'est ni dans l'archive ni
        # transféré ici (NFR-2 — il vit dans shared/, géré par sync-production-env.yml).
        # Pas de TARGET_SFTP_SKIP_HOST_CHECK : la clé hôte est vérifiée via ~/.ssh/known_hosts
        # (étape « Configure SFTP known hosts »).
        env:
          TARGET_HOST: ${{ vars.OUVATON_DEPLOY_HOST }}
          TARGET_PORT: "115"
          TARGET_PROTO: sftp
          TARGET_USER: ${{ vars.OUVATON_DEPLOY_USERNAME }}
          TARGET_PASS: ${{ secrets.OUVATON_DEPLOY_PASSWORD }}
          # Sur Ouvaton, le dossier applicatif est un sous-dossier de la racine SFTP.
          REMOTE_STAGING: ${{ vars.OUVATON_DEPLOY_REMOTE_FOLDER }}/staging
        run: |
          set -euo pipefail
          if [ -z "${TARGET_PASS:-}" ]; then
            echo "::error::OUVATON_DEPLOY_PASSWORD is required."
            exit 1
          fi
          bash scripts/transfer-archive.sh

      - name: Generate bootstrap activation script
        run: |
          set -euo pipefail

          if [ -z "${OUVATON_DEPLOY_REMOTE_FOLDER:-}" ]; then
            echo "::error::OUVATON_DEPLOY_REMOTE_FOLDER est requis pour générer le bootstrap d'activation."
            exit 1
          fi

          sed_escape_replacement() {
            local value="$1"
            value="${value//\\/\\\\}"
            value="${value//&/\\&}"
            value="${value//|/\\|}"
            printf '%s' "${value}"
          }

          BOOTSTRAP_ACTIVATE_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${BOOTSTRAP_ACTIVATE_TOKEN}"
          printf 'BOOTSTRAP_ACTIVATE_TOKEN=%s\n' "${BOOTSTRAP_ACTIVATE_TOKEN}" >> "${GITHUB_ENV}"

          token_replacement="$(sed_escape_replacement "${BOOTSTRAP_ACTIVATE_TOKEN}")"
          remote_folder_replacement="$(sed_escape_replacement "${OUVATON_DEPLOY_REMOTE_FOLDER}")"

          sed -e "s|__BOOTSTRAP_TOKEN__|${token_replacement}|g" \
              -e "s|__REMOTE_FOLDER__|${remote_folder_replacement}|g" \
              deploy/ops-bootstrap-activate.tpl.php > deploy-staging/public/ops-bootstrap-activate.php
          chmod 600 deploy-staging/public/ops-bootstrap-activate.php

      - name: Deploy httpdocs entry point and static assets
        env:
          OUVATON_DEPLOY_HOST: ${{ vars.OUVATON_DEPLOY_HOST }}
          OUVATON_DEPLOY_USERNAME: ${{ vars.OUVATON_DEPLOY_USERNAME }}
          OUVATON_DEPLOY_PASSWORD: ${{ secrets.OUVATON_DEPLOY_PASSWORD }}
          OUVATON_DEPLOY_REMOTE_FOLDER: ${{ vars.OUVATON_DEPLOY_REMOTE_FOLDER }}
          OUVATON_HTTPDOCS_FOLDER: ${{ vars.OUVATON_HTTPDOCS_FOLDER }}
        run: |
          set -euo pipefail
          bash scripts/deploy-httpdocs.sh

      - name: Verify production ops HMAC secret
        env:
          OPS_HMAC_SECRET: ${{ secrets.OPS_MIGRATION_HMAC_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${OPS_HMAC_SECRET:-}" ]; then
            echo "::error::OPS_MIGRATION_HMAC_SECRET est requis."
            exit 1
          fi

          lftp_quote() {
            local value="$1"
            value="${value//\\/\\\\}"
            value="${value//\"/\\\"}"
            printf '"%s"' "${value}"
          }

          trim_whitespace() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value}"
          }

          parse_dotenv_secret() {
            local line="$1"
            local value="${line#*=}"
            value="$(trim_whitespace "${value}")"

            if [[ "${value}" == \"*\" ]]; then
              value="${value:1:${#value}-2}"
              value="${value//\\\"/\"}"
              value="${value//\\\\/\\}"
            fi

            printf '%s' "${value}"
          }

          env_copy="${RUNNER_TEMP:-/tmp}/kermesse-production.env"
          remote_env="${OUVATON_DEPLOY_REMOTE_FOLDER}/shared/.env"

          {
            printf 'set cmd:fail-exit yes\n'
            printf 'set net:max-retries 3\n'
            printf 'set net:timeout 60\n'
            printf 'open -u %s,%s -p 115 sftp://%s\n' \
              "$(lftp_quote "${OUVATON_DEPLOY_USERNAME}")" \
              "$(lftp_quote "${OUVATON_DEPLOY_PASSWORD}")" \
              "${OUVATON_DEPLOY_HOST}"
            printf 'get %s -o %s\n' "$(lftp_quote "${remote_env}")" "$(lftp_quote "${env_copy}")"
            printf 'bye\n'
          } | lftp

          secret_line="$(grep -E '^[[:space:]]*kermesse\.opsMigrationHmacSecret[[:space:]]*=' "${env_copy}" | tail -n 1 || true)"
          rm -f "${env_copy}"

          if [ -z "${secret_line}" ]; then
            echo "::error::shared/.env ne contient pas kermesse.opsMigrationHmacSecret."
            exit 1
          fi

          remote_secret="$(parse_dotenv_secret "${secret_line}")"

          if [ "${remote_secret}" != "${OPS_HMAC_SECRET}" ]; then
            echo "::error::Le secret HMAC de shared/.env ne correspond pas au secret GitHub OPS_MIGRATION_HMAC_SECRET."
            echo "::error::Longueurs observées: shared/.env=${#remote_secret}, GitHub=${#OPS_HMAC_SECRET}. Relancer Sync production .env to Ouvaton après correction des secrets."
            exit 1
          fi

          echo "Production ops HMAC secret verified against shared/.env."

      - name: Activate release via bootstrap script
        run: |
          set -euo pipefail
          source scripts/lib/ops-sign.sh

          BASE_URL="$(echo "${KERMESSE_PUBLIC_BASE_URL}" | sed 's:/*$::')"
          ALLOW_INSECURE_TLS="${KERMESSE_ALLOW_INSECURE_TLS:-false}"

          if [ -z "$BASE_URL" ] || [ -z "${BOOTSTRAP_ACTIVATE_TOKEN:-}" ]; then
            echo "::error::KERMESSE_PUBLIC_BASE_URL et BOOTSTRAP_ACTIVATE_TOKEN sont requis."
            exit 1
          fi
          # Flux bootstrap : authentifié au jeton à usage unique, sans HMAC.
          # On ne valide donc QUE le schéma https:// (pas de OPS_HMAC_SECRET ici).
          ops_require_https "$BASE_URL"

          CURL_TLS_ARGS=()
          if [[ "${ALLOW_INSECURE_TLS,,}" == "true" ]]; then
            echo "::warning::KERMESSE_ALLOW_INSECURE_TLS=true : vérification TLS désactivée pour l'activation."
            CURL_TLS_ARGS+=(--insecure)
          fi

          ACTIVATE_URL="${BASE_URL}/ops-bootstrap-activate.php"

          echo "Appel du bootstrap d'activation..."
          activate_response_body="${RUNNER_TEMP:-/tmp}/ops-activate-response.json"

          HTTP_CODE=$(curl --max-time 120 --retry 3 -sS ${CURL_TLS_ARGS[@]:+"${CURL_TLS_ARGS[@]}"} -X POST \
            -H "X-Kermesse-Bootstrap-Token: ${BOOTSTRAP_ACTIVATE_TOKEN}" \
            -w "%{http_code}" -o "${activate_response_body}" \
            "${ACTIVATE_URL}")

          if [ -s "${activate_response_body}" ]; then
            cat "${activate_response_body}" >&2
            printf '\n' >&2
          fi

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::L'activation autonome a échoué (HTTP $HTTP_CODE)."
            exit 1
          fi

          echo "Activation réussie avec succès !"

      - name: Cleanup bootstrap script from server
        if: always()
        run: |
          set -euo pipefail

          lftp_quote() {
            local value="$1"
            value="${value//\\/\\\\}"
            value="${value//\"/\\\"}"
            printf '"%s"' "${value}"
          }

          remote_script="${OUVATON_HTTPDOCS_FOLDER}/ops-bootstrap-activate.php"

          if [ -z "${BOOTSTRAP_ACTIVATE_TOKEN:-}" ]; then
            echo "Aucun script bootstrap généré dans ce run ; cleanup distant ignoré."
            exit 0
          fi

          echo "Suppression du script d'activation temporaire sur le serveur..."
          {
            printf 'set cmd:fail-exit no\n'
            printf 'set net:max-retries 2\n'
            printf 'set net:timeout 30\n'
            printf 'open -u %s,%s -p 115 sftp://%s\n' \
              "$(lftp_quote "${OUVATON_DEPLOY_USERNAME}")" \
              "$(lftp_quote "${OUVATON_DEPLOY_PASSWORD}")" \
              "${OUVATON_DEPLOY_HOST}"
            printf 'rm %s\n' "$(lftp_quote "${remote_script}")"
            printf 'bye\n'
          } | lftp || { echo "::error::Impossible de supprimer le script temporaire."; exit 1; }

      - name: Drift-fix — remédiation checksum connu avant migration
        env:
          OPS_HMAC_SECRET: ${{ secrets.OPS_MIGRATION_HMAC_SECRET }}
        run: |
          set -euo pipefail
          source scripts/lib/ops-sign.sh

          BASE_URL="$(echo "${KERMESSE_PUBLIC_BASE_URL}" | sed 's:/*$::')"
          ALLOW_INSECURE_TLS="${KERMESSE_ALLOW_INSECURE_TLS:-false}"
          ops_require_https_endpoint "$BASE_URL" 32

          CURL_TLS_ARGS=()
          if [[ "${ALLOW_INSECURE_TLS,,}" == "true" ]]; then
            CURL_TLS_ARGS+=(--insecure)
          fi

          ROUTE="ops/fix-drift"
          BODY='{"version":"20260614121500_add_last_login_at_to_users"}'
          ops_sign "$ROUTE" "$BODY"

          HTTP_CODE=$(curl --max-time 60 --retry 2 -sS ${CURL_TLS_ARGS[@]:+"${CURL_TLS_ARGS[@]}"} -X POST "${BASE_URL}/${ROUTE}" \
            -H "Content-Type: application/json" \
            -H "X-Kermesse-Timestamp: ${SIGN_TS}" \
            -H "X-Kermesse-Nonce: ${SIGN_NONCE}" \
            -H "X-Kermesse-Signature: ${SIGN_SIG}" \
            -w "%{http_code}" -o /dev/stderr \
            -d "$BODY")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::ops/fix-drift a retourné HTTP $HTTP_CODE. Impossible de réconcilier le drift de checksum."
            exit 1
          fi
          echo "Drift-fix OK — checksum réconcilié (ou déjà à jour)"

      - name: Préflight migration — vérification de l'état avant application
        env:
          OPS_HMAC_SECRET: ${{ secrets.OPS_MIGRATION_HMAC_SECRET }}
        run: |
          set -euo pipefail
          source scripts/lib/ops-sign.sh

          BASE_URL="$(echo "${KERMESSE_PUBLIC_BASE_URL}" | sed 's:/*$::')"
          ALLOW_INSECURE_TLS="${KERMESSE_ALLOW_INSECURE_TLS:-false}"
          ops_require_https_endpoint "$BASE_URL" 32

          CURL_TLS_ARGS=()
          if [[ "${ALLOW_INSECURE_TLS,,}" == "true" ]]; then
            CURL_TLS_ARGS+=(--insecure)
          fi

          ROUTE="ops/migrate/status"
          ops_sign "$ROUTE"

          PREFLIGHT_FILE="${RUNNER_TEMP:-/tmp}/preflight-status.json"
          HTTP_CODE=$(curl --max-time 60 --retry 2 -sS ${CURL_TLS_ARGS[@]:+"${CURL_TLS_ARGS[@]}"} -X POST "${BASE_URL}/${ROUTE}" \
            -H "Content-Type: application/json" \
            -H "X-Kermesse-Timestamp: ${SIGN_TS}" \
            -H "X-Kermesse-Nonce: ${SIGN_NONCE}" \
            -H "X-Kermesse-Signature: ${SIGN_SIG}" \
            -w "%{http_code}" -o "${PREFLIGHT_FILE}" \
            -d '{}')

          echo "Préflight HTTP : ${HTTP_CODE}"
          if [ -s "${PREFLIGHT_FILE}" ]; then cat "${PREFLIGHT_FILE}"; printf '\n'; fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Préflight ops/migrate/status a retourné HTTP $HTTP_CODE."
            exit 1
          fi

          FAILED_COUNT="$(jq -r 'if .failed then (.failed | length) else 0 end' "${PREFLIGHT_FILE}" 2>/dev/null || echo "unknown")"
          if [ "${FAILED_COUNT}" != "0" ]; then
            echo "::error::Préflight — ${FAILED_COUNT} migration(s) en drift/échec. Résoudre avant de continuer."
            exit 1
          fi
          echo "Préflight OK — aucune migration en échec"

      - name: Migration Phase 1 — vue de compatibilité slot_signups (expand)
        # Phase 1 de l'expand/contract : crée la VIEW slot_signups → signups AVANT activation
        # du nouveau code. Le code activé (qui référence slot_signups) dispose ainsi de la
        # vue dès la première requête, éliminant la fenêtre de downtime entre activation et
        # premier POST /ops/migrate dans l'approche monolithique.
        #
        # CONTRAINTE : ce step est exécuté avec le nouveau code déjà activé (le bootstrap
        # d'activation précède ce step). Pour les déploiements futurs utilisant ce pattern,
        # la Phase 1 doit précéder l'activation dans le workflow.
        env:
          OPS_HMAC_SECRET: ${{ secrets.OPS_MIGRATION_HMAC_SECRET }}
        run: |
          set -euo pipefail
          source scripts/lib/ops-sign.sh

          BASE_URL="$(echo "${KERMESSE_PUBLIC_BASE_URL}" | sed 's:/*$::')"
          ALLOW_INSECURE_TLS="${KERMESSE_ALLOW_INSECURE_TLS:-false}"
          ops_require_https_endpoint "$BASE_URL" 32

          CURL_TLS_ARGS=()
          if [[ "${ALLOW_INSECURE_TLS,,}" == "true" ]]; then
            CURL_TLS_ARGS+=(--insecure)
          fi

          ROUTE="ops/migrate"
          BODY='{"until_version":"20260619500000_create_slot_signups_compat_view"}'
          ops_sign "$ROUTE" "$BODY"

          PHASE1_FILE="${RUNNER_TEMP:-/tmp}/phase1-migrate.json"
          HTTP_CODE=$(curl --max-time 120 --retry 2 -sS ${CURL_TLS_ARGS[@]:+"${CURL_TLS_ARGS[@]}"} -X POST "${BASE_URL}/${ROUTE}" \
            -H "Content-Type: application/json" \
            -H "X-Kermesse-Timestamp: ${SIGN_TS}" \
            -H "X-Kermesse-Nonce: ${SIGN_NONCE}" \
            -H "X-Kermesse-Signature: ${SIGN_SIG}" \
            -w "%{http_code}" -o "${PHASE1_FILE}" \
            -d "$BODY")

          echo "Phase 1 HTTP : ${HTTP_CODE}"
          if [ -s "${PHASE1_FILE}" ]; then cat "${PHASE1_FILE}"; printf '\n'; fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Migration Phase 1 a retourné HTTP $HTTP_CODE. La vue de compatibilité slot_signups n'a pas pu être créée."
            exit 1
          fi
          echo "Migration Phase 1 OK — vue de compatibilité slot_signups créée (ou déjà présente)"

      - name: Migration Phase 2 — renommage physique signups → slot_signups (contract)
        # Phase 2 : DROP VIEW slot_signups + RENAME TABLE signups → slot_signups.
        # Exécutée uniquement après confirmation que la Phase 1 a réussi.
        # ops-sign.sh attend OPS_HMAC_SECRET ; on y mappe le secret de migration.
        env:
          OPS_HMAC_SECRET: ${{ secrets.OPS_MIGRATION_HMAC_SECRET }}
        run: |
          set -euo pipefail
          # MÊME signature qu'en répétition (scripts/deploy-rehearsal.sh) — source unique (FR-18).
          source scripts/lib/ops-sign.sh

          # Sanitize BASE_URL by stripping any trailing slashes
          BASE_URL="$(echo "${KERMESSE_PUBLIC_BASE_URL}" | sed 's:/*$::')"
          ALLOW_INSECURE_TLS="${KERMESSE_ALLOW_INSECURE_TLS:-false}"

          if [ -z "$BASE_URL" ] || [ -z "${OPS_HMAC_SECRET:-}" ]; then
            echo "::error::KERMESSE_PUBLIC_BASE_URL et OPS_MIGRATION_HMAC_SECRET sont requis."
            exit 1
          fi
          ops_require_https_endpoint "$BASE_URL" 32

          ROUTE="ops/migrate"
          BODY='{}'
          ops_sign "$ROUTE" "$BODY"

          CURL_TLS_ARGS=()
          if [[ "${ALLOW_INSECURE_TLS,,}" == "true" ]]; then
            echo "::warning::KERMESSE_ALLOW_INSECURE_TLS=true : vérification TLS désactivée pour les migrations. À retirer dès que le certificat de production est valide."
            CURL_TLS_ARGS+=(--insecure)
          fi

          # curl -fsS : -f échoue sur HTTP 4xx/5xx (failed > 0 ou code ≠ 200 ⇒ job rouge).
          HTTP_CODE=$(curl --max-time 300 --retry 3 -fsS ${CURL_TLS_ARGS[@]:+"${CURL_TLS_ARGS[@]}"} -X POST "${BASE_URL}/${ROUTE}" \
            -H "Content-Type: application/json" \
            -H "X-Kermesse-Timestamp: ${SIGN_TS}" \
            -H "X-Kermesse-Nonce: ${SIGN_NONCE}" \
            -H "X-Kermesse-Signature: ${SIGN_SIG}" \
            -w "%{http_code}" -o /dev/stderr \
            -d "$BODY")

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Webhook Phase 2 échoué ou redirigé (HTTP $HTTP_CODE). L'URL ne doit pas déclencher de redirection 3xx."
            exit 1
          fi

      - name: Smoke test migration — vérifier slot_signups dans applied
        # P7 : vérifie explicitement que la migration de renommage est bien dans 'applied'.
        # Complète le postflight pending=[]/failed=[] par une assertion positive sur le nom
        # exact de la migration critique — sans accès DB direct depuis les runners GitHub.
        env:
          OPS_HMAC_SECRET: ${{ secrets.OPS_MIGRATION_HMAC_SECRET }}
        run: |
          set -euo pipefail
          source scripts/lib/ops-sign.sh

          BASE_URL="$(echo "${KERMESSE_PUBLIC_BASE_URL}" | sed 's:/*$::')"
          ALLOW_INSECURE_TLS="${KERMESSE_ALLOW_INSECURE_TLS:-false}"
          ops_require_https_endpoint "$BASE_URL" 32

          CURL_TLS_ARGS=()
          if [[ "${ALLOW_INSECURE_TLS,,}" == "true" ]]; then
            CURL_TLS_ARGS+=(--insecure)
          fi

          ROUTE="ops/migrate/status"
          ops_sign "$ROUTE"

          SMOKE_FILE="${RUNNER_TEMP:-/tmp}/smoke-status.json"
          HTTP_CODE=$(curl --max-time 60 --retry 2 -sS ${CURL_TLS_ARGS[@]:+"${CURL_TLS_ARGS[@]}"} -X POST "${BASE_URL}/${ROUTE}" \
            -H "Content-Type: application/json" \
            -H "X-Kermesse-Timestamp: ${SIGN_TS}" \
            -H "X-Kermesse-Nonce: ${SIGN_NONCE}" \
            -H "X-Kermesse-Signature: ${SIGN_SIG}" \
            -w "%{http_code}" -o "${SMOKE_FILE}" \
            -d '{}')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Smoke test ops/migrate/status a retourné HTTP $HTTP_CODE."
            exit 1
          fi

          # Vérifier que la migration de renommage est bien dans applied[].
          RENAME_APPLIED="$(jq -r '(.applied // []) | map(select(startswith("20260620000000"))) | length' "${SMOKE_FILE}" 2>/dev/null || echo "unknown")"
          if [ "${RENAME_APPLIED}" != "1" ]; then
            echo "::error::Smoke test — 20260620000000_rename_signups_to_slot_signups absent de applied[] (found=${RENAME_APPLIED})."
            cat "${SMOKE_FILE}" || true
            exit 1
          fi
          echo "Smoke test OK — migration de renommage confirmée dans applied[]"

      - name: Postflight migration — vérification pending=[] et failed=[]
        env:
          OPS_HMAC_SECRET: ${{ secrets.OPS_MIGRATION_HMAC_SECRET }}
        run: |
          set -euo pipefail
          source scripts/lib/ops-sign.sh

          BASE_URL="$(echo "${KERMESSE_PUBLIC_BASE_URL}" | sed 's:/*$::')"
          ALLOW_INSECURE_TLS="${KERMESSE_ALLOW_INSECURE_TLS:-false}"
          ops_require_https_endpoint "$BASE_URL" 32

          CURL_TLS_ARGS=()
          if [[ "${ALLOW_INSECURE_TLS,,}" == "true" ]]; then
            CURL_TLS_ARGS+=(--insecure)
          fi

          ROUTE="ops/migrate/status"
          ops_sign "$ROUTE"

          POSTFLIGHT_FILE="${RUNNER_TEMP:-/tmp}/postflight-status.json"
          HTTP_CODE=$(curl --max-time 60 --retry 2 -sS ${CURL_TLS_ARGS[@]:+"${CURL_TLS_ARGS[@]}"} -X POST "${BASE_URL}/${ROUTE}" \
            -H "Content-Type: application/json" \
            -H "X-Kermesse-Timestamp: ${SIGN_TS}" \
            -H "X-Kermesse-Nonce: ${SIGN_NONCE}" \
            -H "X-Kermesse-Signature: ${SIGN_SIG}" \
            -w "%{http_code}" -o "${POSTFLIGHT_FILE}" \
            -d '{}')

          echo "Postflight HTTP : ${HTTP_CODE}"
          if [ -s "${POSTFLIGHT_FILE}" ]; then cat "${POSTFLIGHT_FILE}"; printf '\n'; fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Postflight ops/migrate/status a retourné HTTP $HTTP_CODE."
            exit 1
          fi

          PENDING_COUNT="$(jq -r 'if .pending then (.pending | length) else 0 end' "${POSTFLIGHT_FILE}" 2>/dev/null || echo "unknown")"
          FAILED_COUNT="$(jq -r 'if .failed then (.failed | length) else 0 end' "${POSTFLIGHT_FILE}" 2>/dev/null || echo "unknown")"

          if [ "${PENDING_COUNT}" != "0" ]; then
            echo "::error::Postflight — ${PENDING_COUNT} migration(s) encore en attente. Le déploiement est incomplet."
            exit 1
          fi
          if [ "${FAILED_COUNT}" != "0" ]; then
            echo "::error::Postflight — ${FAILED_COUNT} migration(s) en échec. Déclencher la procédure Stop/Rollback."
            exit 1
          fi
          echo "Postflight OK — pending=[] et failed=[]"

      - name: Post-deploy health check
        run: |
          set -euo pipefail
          BASE_URL="$(echo "${KERMESSE_PUBLIC_BASE_URL}" | sed 's:/*$::')"
          ALLOW_INSECURE_TLS="${KERMESSE_ALLOW_INSECURE_TLS:-false}"
          CURL_TLS_ARGS=()
          if [[ "${ALLOW_INSECURE_TLS,,}" == "true" ]]; then
            CURL_TLS_ARGS+=(--insecure)
          fi
          echo "Contrôle de santé post-déploiement : ${BASE_URL}/"
          HTTP_CODE=$(curl --max-time 30 -sS ${CURL_TLS_ARGS[@]:+"${CURL_TLS_ARGS[@]}"} \
            -o /dev/null -w "%{http_code}" "${BASE_URL}/")
          if [[ "${HTTP_CODE}" -lt 200 || "${HTTP_CODE}" -ge 500 ]]; then
            echo "::error::Contrôle de santé post-déploiement échoué (HTTP ${HTTP_CODE}). Déclencher la procédure Stop/Rollback."
            exit 1
          fi
          echo "Contrôle de santé OK : HTTP ${HTTP_CODE}"
          echo "health_check_status=ok" >> "${GITHUB_OUTPUT}"
          # Archiver le résultat du postflight
          cat > "${RUNNER_TEMP:-/tmp}/postflight-report.json" <<POSTFLIGHT
          {
            "health_check_http_code": ${HTTP_CODE},
            "health_check_status": "ok",
            "candidate_sha": "${{ needs.download-and-verify.outputs.candidate_sha }}",
            "archive_sha256": "${{ needs.download-and-verify.outputs.archive_sha256 }}"
          }
          POSTFLIGHT
          echo "Rapport postflight écrit."

      - name: Fetch production log tail on deploy failure
        if: failure()
        run: |
          set -euo pipefail

          lftp_quote() {
            local value="$1"
            value="${value//\\/\\\\}"
            value="${value//\"/\\\"}"
            printf '"%s"' "${value}"
          }

          requested_date="$(date -u +%F)"
          download_dir="${RUNNER_TEMP:-/tmp}/ouvaton-logs"
          raw_log="${download_dir}/log-${requested_date}"
          remote_log_base="${OUVATON_DEPLOY_REMOTE_FOLDER}/shared/writable/logs/log-${requested_date}"
          mkdir -p "${download_dir}"

          fetched_log=""
          for extension in log php; do
            remote_log="${remote_log_base}.${extension}"
            candidate_log="${raw_log}.${extension}"

            if {
              printf 'set cmd:fail-exit yes\n'
              printf 'set net:max-retries 2\n'
              printf 'set net:timeout 30\n'
              printf 'open -u %s,%s -p 115 sftp://%s\n' \
                "$(lftp_quote "${OUVATON_DEPLOY_USERNAME}")" \
                "$(lftp_quote "${OUVATON_DEPLOY_PASSWORD}")" \
                "${OUVATON_DEPLOY_HOST}"
              printf 'get %s -o %s\n' "$(lftp_quote "${remote_log}")" "$(lftp_quote "${candidate_log}")"
              printf 'bye\n'
            } | lftp; then
              if [ -s "${candidate_log}" ]; then
                fetched_log="${candidate_log}"
                echo "::group::Production application log tail (${remote_log})"
                tail -n 120 "${fetched_log}" || true
                echo "::endgroup::"
                break
              fi
            fi
          done

          if [ -z "${fetched_log}" ]; then
            echo "::warning::Aucun log applicatif récupéré (${remote_log_base}.log ou ${remote_log_base}.php)."
          fi
