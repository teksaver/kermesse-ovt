name: Deploy to Ouvaton

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    environment: production

    env:
      PHP_VERSION: '8.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, intl, json, mysqli, sqlite3
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies (with dev for tests)
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: composer test

      # --- Packaging ---
      - name: Run packaging script
        run: bash scripts/package-deploy-artifact.sh

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: kermesse-deploy
          path: build/kermesse-deploy.zip
          retention-days: 14

  deploy:
    needs: build-and-package
    runs-on: ubuntu-latest
    environment: production
    # Le deploiement reste desactive tant que le protocole et les identifiants Ouvaton ne sont pas confirmes.
    # Retirer la condition 'if: false' une fois les secrets OUVATON_DEPLOY_* configures.
    if: false

    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: kermesse-deploy

      - name: Extract artifact
        run: |
          mkdir -p deploy-staging
          unzip kermesse-deploy.zip -d deploy-staging

      # Emplacement reserve pour l'etape d'envoi distant.
      # La methode de transfert exacte depend des capacites du compte Ouvaton :
      #   - FTP/FTPS : utiliser SamKirkland/FTP-Deploy-Action ou lftp
      #   - SFTP : utiliser ssh/scp/rsync via SSH
      #
      # Secrets GitHub requis, a configurer dans l'environnement 'production' :
      #   OUVATON_DEPLOY_PROTOCOL  - ftp, ftps ou sftp
      #   OUVATON_DEPLOY_HOST      - nom d'hote du serveur Ouvaton
      #   OUVATON_DEPLOY_USERNAME  - identifiant du compte Ouvaton
      #   OUVATON_DEPLOY_PASSWORD  - mot de passe ou cle SSH du compte Ouvaton
      #   OUVATON_DEPLOY_REMOTE_PATH - chemin distant sur Ouvaton, par exemple /www/kermesse
      #
      # IMPORTANT : l'etape de deploiement applicatif ne doit jamais ecraser le .env de production.
      # Le .env de production est gere par .github/workflows/sync-production-env.yml.
      #
      # Futur : apres la Story 1.3 et le runner de migrations securise,
      # ajouter une etape post-deploiement vers POST /ops/migrate avec authentification HMAC.
      - name: Deploy to Ouvaton (placeholder)
        run: |
          echo "================================================================="
          echo "DEPLOY STEP: Not yet activated."
          echo "Ouvaton protocol, host, and credentials must be confirmed first."
          echo "See docs/deployment-ouvaton.md for setup instructions."
          echo "================================================================="
