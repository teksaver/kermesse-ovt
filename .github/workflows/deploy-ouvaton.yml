name: Deploy to Ouvaton

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-package:
    # Auto-deploy only when CI succeeds on main; manual dispatch is always allowed.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production

    env:
      PHP_VERSION: '8.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Require successful CI for this commit
        # Skipped when auto-triggered by workflow_run — CI conclusion is already guaranteed above.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          successful_runs="$(gh run list \
            --workflow CI \
            --commit "$GITHUB_SHA" \
            --branch main \
            --status success \
            --json databaseId \
            --jq 'length')"

          if [ "$successful_runs" -lt 1 ]; then
            echo "::error::No successful CI run found for ${GITHUB_SHA} on main. Run CI before deploying."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, intl, json, mysqli, sqlite3
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies (with dev for tests)
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --exclude-group mariadb

      - name: Run packaging script
        run: bash scripts/package-deploy-artifact.sh

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: kermesse-deploy
          path: |
            build/kermesse-deploy.tar.gz
            build/kermesse-deploy.tar.gz.sha256
          retention-days: 14

  deploy:
    needs: build-and-package
    runs-on: ubuntu-latest
    environment: production

    env:
      # Variables (non-sensitive) — only what the deploy steps actually use.
      # Database, email, token, and session vars have been removed: the deploy
      # job no longer generates a .env file (NFR-2). The .env lives in shared/
      # and is managed by sync-production-env.yml.
      OUVATON_DEPLOY_HOST: ${{ vars.OUVATON_DEPLOY_HOST }}
      OUVATON_DEPLOY_USERNAME: ${{ vars.OUVATON_DEPLOY_USERNAME }}
      OUVATON_DEPLOY_REMOTE_FOLDER: ${{ vars.OUVATON_DEPLOY_REMOTE_FOLDER }}
      OUVATON_HTTPDOCS_FOLDER: ${{ vars.OUVATON_HTTPDOCS_FOLDER }}
      KERMESSE_PUBLIC_BASE_URL: ${{ vars.KERMESSE_PUBLIC_BASE_URL }}
      KERMESSE_ALLOW_INSECURE_TLS: ${{ vars.KERMESSE_ALLOW_INSECURE_TLS }}
      # Secrets (sensitive credentials)
      OUVATON_DEPLOY_PASSWORD: ${{ secrets.OUVATON_DEPLOY_PASSWORD }}
      OUVATON_SFTP_KNOWN_HOST: ${{ secrets.OUVATON_SFTP_KNOWN_HOST }}
      # Le secret HMAC est injecté au niveau des étapes webhook (sous le nom OPS_HMAC_SECRET
      # attendu par scripts/lib/ops-sign.sh), pas au niveau du job.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install transfer client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Configure SFTP known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${OUVATON_SFTP_KNOWN_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ensure production .env exists for first install
        env:
          SYNC_ENV_MODE: ensure-present
          KERMESSE_OUVATON_ROOT: ${{ vars.KERMESSE_OUVATON_ROOT }}
          KERMESSE_DATABASE_HOSTNAME: ${{ vars.KERMESSE_DATABASE_HOSTNAME }}
          KERMESSE_DATABASE_DATABASE: ${{ vars.KERMESSE_DATABASE_DATABASE }}
          KERMESSE_DATABASE_USERNAME: ${{ vars.KERMESSE_DATABASE_USERNAME }}
          KERMESSE_EMAIL_SMTP_HOST: ${{ vars.KERMESSE_EMAIL_SMTP_HOST }}
          KERMESSE_EMAIL_SMTP_USER: ${{ vars.KERMESSE_EMAIL_SMTP_USER }}
          KERMESSE_EMAIL_FROM_EMAIL: ${{ vars.KERMESSE_EMAIL_FROM_EMAIL }}
          KERMESSE_APP_TIMEZONE: ${{ vars.KERMESSE_APP_TIMEZONE }}
          KERMESSE_EMAIL_FROM_NAME: ${{ vars.KERMESSE_EMAIL_FROM_NAME }}
          KERMESSE_EMAIL_SMTP_PORT: ${{ vars.KERMESSE_EMAIL_SMTP_PORT }}
          KERMESSE_EMAIL_SMTP_CRYPTO: ${{ vars.KERMESSE_EMAIL_SMTP_CRYPTO }}
          KERMESSE_OPS_PROBE_ENABLED: ${{ vars.KERMESSE_OPS_PROBE_ENABLED }}
          KERMESSE_DATABASE_PASSWORD: ${{ secrets.KERMESSE_DATABASE_PASSWORD }}
          KERMESSE_EMAIL_SMTP_PASS: ${{ secrets.KERMESSE_EMAIL_SMTP_PASS }}
          KERMESSE_TOKEN_SECRET: ${{ secrets.KERMESSE_TOKEN_SECRET }}
          OPS_MIGRATION_HMAC_SECRET: ${{ secrets.OPS_MIGRATION_HMAC_SECRET }}
        run: bash scripts/sync-production-env.sh

      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: kermesse-deploy
          # Dépose l'archive dans build/ — emplacement attendu par scripts/transfer-archive.sh.
          path: build

      - name: Verify and extract artifact
        run: |
          set -euo pipefail
          # Le .sha256 référence l'archive par son nom nu → vérifier depuis build/.
          ( cd build && sha256sum -c kermesse-deploy.tar.gz.sha256 ) || { echo "::error::Artefact corrompu"; exit 1; }
          mkdir -p deploy-staging
          # Extract only the public directory needed for static assets.
          # New artifacts use top-level entries without "./"; keep a fallback for older reruns.
          tar -xzf build/kermesse-deploy.tar.gz -C deploy-staging public \
            || tar -xzf build/kermesse-deploy.tar.gz -C deploy-staging ./public

      - name: Upload archive to staging
        # Réutilise EXACTEMENT le script validé en répétition (locale + job CI deploy-rehearsal)
        # au lieu de réimplémenter lftp inline : la parité FR-18 couvre désormais le transfert
        # de production. put (jamais mirror) ; le .env de prod n'est ni dans l'archive ni
        # transféré ici (NFR-2 — il vit dans shared/, géré par sync-production-env.yml).
        # Pas de TARGET_SFTP_SKIP_HOST_CHECK : la clé hôte est vérifiée via ~/.ssh/known_hosts
        # (étape « Configure SFTP known hosts »).
        env:
          TARGET_HOST: ${{ vars.OUVATON_DEPLOY_HOST }}
          TARGET_PORT: "115"
          TARGET_PROTO: sftp
          TARGET_USER: ${{ vars.OUVATON_DEPLOY_USERNAME }}
          TARGET_PASS: ${{ secrets.OUVATON_DEPLOY_PASSWORD }}
          # Sur Ouvaton, le dossier applicatif est un sous-dossier de la racine SFTP.
          REMOTE_STAGING: ${{ vars.OUVATON_DEPLOY_REMOTE_FOLDER }}/staging
        run: |
          set -euo pipefail
          if [ -z "${TARGET_PASS:-}" ]; then
            echo "::error::OUVATON_DEPLOY_PASSWORD is required."
            exit 1
          fi
          bash scripts/transfer-archive.sh

      - name: Generate bootstrap activation script
        run: |
          set -euo pipefail

          if [ -z "${OUVATON_DEPLOY_REMOTE_FOLDER:-}" ]; then
            echo "::error::OUVATON_DEPLOY_REMOTE_FOLDER est requis pour générer le bootstrap d'activation."
            exit 1
          fi

          sed_escape_replacement() {
            local value="$1"
            value="${value//\\/\\\\}"
            value="${value//&/\\&}"
            value="${value//|/\\|}"
            printf '%s' "${value}"
          }

          BOOTSTRAP_ACTIVATE_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${BOOTSTRAP_ACTIVATE_TOKEN}"
          printf 'BOOTSTRAP_ACTIVATE_TOKEN=%s\n' "${BOOTSTRAP_ACTIVATE_TOKEN}" >> "${GITHUB_ENV}"

          token_replacement="$(sed_escape_replacement "${BOOTSTRAP_ACTIVATE_TOKEN}")"
          remote_folder_replacement="$(sed_escape_replacement "${OUVATON_DEPLOY_REMOTE_FOLDER}")"

          sed -e "s|__BOOTSTRAP_TOKEN__|${token_replacement}|g" \
              -e "s|__REMOTE_FOLDER__|${remote_folder_replacement}|g" \
              deploy/ops-bootstrap-activate.tpl.php > deploy-staging/public/ops-bootstrap-activate.php
          chmod 600 deploy-staging/public/ops-bootstrap-activate.php

      - name: Deploy httpdocs entry point and static assets
        env:
          OUVATON_DEPLOY_HOST: ${{ vars.OUVATON_DEPLOY_HOST }}
          OUVATON_DEPLOY_USERNAME: ${{ vars.OUVATON_DEPLOY_USERNAME }}
          OUVATON_DEPLOY_PASSWORD: ${{ secrets.OUVATON_DEPLOY_PASSWORD }}
          OUVATON_DEPLOY_REMOTE_FOLDER: ${{ vars.OUVATON_DEPLOY_REMOTE_FOLDER }}
          OUVATON_HTTPDOCS_FOLDER: ${{ vars.OUVATON_HTTPDOCS_FOLDER }}
        run: |
          set -euo pipefail
          bash scripts/deploy-httpdocs.sh

      - name: Verify production ops HMAC secret
        env:
          OPS_HMAC_SECRET: ${{ secrets.OPS_MIGRATION_HMAC_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${OPS_HMAC_SECRET:-}" ]; then
            echo "::error::OPS_MIGRATION_HMAC_SECRET est requis."
            exit 1
          fi

          lftp_quote() {
            local value="$1"
            value="${value//\\/\\\\}"
            value="${value//\"/\\\"}"
            printf '"%s"' "${value}"
          }

          trim_whitespace() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value}"
          }

          parse_dotenv_secret() {
            local line="$1"
            local value="${line#*=}"
            value="$(trim_whitespace "${value}")"

            if [[ "${value}" == \"*\" ]]; then
              value="${value:1:${#value}-2}"
              value="${value//\\\"/\"}"
              value="${value//\\\\/\\}"
            fi

            printf '%s' "${value}"
          }

          env_copy="${RUNNER_TEMP:-/tmp}/kermesse-production.env"
          remote_env="${OUVATON_DEPLOY_REMOTE_FOLDER}/shared/.env"

          {
            printf 'set cmd:fail-exit yes\n'
            printf 'set net:max-retries 3\n'
            printf 'set net:timeout 60\n'
            printf 'open -u %s,%s -p 115 sftp://%s\n' \
              "$(lftp_quote "${OUVATON_DEPLOY_USERNAME}")" \
              "$(lftp_quote "${OUVATON_DEPLOY_PASSWORD}")" \
              "${OUVATON_DEPLOY_HOST}"
            printf 'get %s -o %s\n' "$(lftp_quote "${remote_env}")" "$(lftp_quote "${env_copy}")"
            printf 'bye\n'
          } | lftp

          secret_line="$(grep -E '^[[:space:]]*kermesse\.opsMigrationHmacSecret[[:space:]]*=' "${env_copy}" | tail -n 1 || true)"
          rm -f "${env_copy}"

          if [ -z "${secret_line}" ]; then
            echo "::error::shared/.env ne contient pas kermesse.opsMigrationHmacSecret."
            exit 1
          fi

          remote_secret="$(parse_dotenv_secret "${secret_line}")"

          if [ "${remote_secret}" != "${OPS_HMAC_SECRET}" ]; then
            echo "::error::Le secret HMAC de shared/.env ne correspond pas au secret GitHub OPS_MIGRATION_HMAC_SECRET."
            echo "::error::Longueurs observées: shared/.env=${#remote_secret}, GitHub=${#OPS_HMAC_SECRET}. Relancer Sync production .env to Ouvaton après correction des secrets."
            exit 1
          fi

          echo "Production ops HMAC secret verified against shared/.env."

      - name: Activate release via bootstrap script
        run: |
          set -euo pipefail
          source scripts/lib/ops-sign.sh

          BASE_URL="$(echo "${KERMESSE_PUBLIC_BASE_URL}" | sed 's:/*$::')"
          ALLOW_INSECURE_TLS="${KERMESSE_ALLOW_INSECURE_TLS:-false}"

          if [ -z "$BASE_URL" ] || [ -z "${BOOTSTRAP_ACTIVATE_TOKEN:-}" ]; then
            echo "::error::KERMESSE_PUBLIC_BASE_URL et BOOTSTRAP_ACTIVATE_TOKEN sont requis."
            exit 1
          fi
          ops_require_https_endpoint "$BASE_URL" 32

          CURL_TLS_ARGS=()
          if [[ "${ALLOW_INSECURE_TLS,,}" == "true" ]]; then
            echo "::warning::KERMESSE_ALLOW_INSECURE_TLS=true : vérification TLS désactivée pour l'activation."
            CURL_TLS_ARGS+=(--insecure)
          fi

          ACTIVATE_URL="${BASE_URL}/ops-bootstrap-activate.php"

          echo "Appel du bootstrap d'activation..."
          activate_response_body="${RUNNER_TEMP:-/tmp}/ops-activate-response.json"

          HTTP_CODE=$(curl --max-time 120 --retry 3 -sS ${CURL_TLS_ARGS[@]:+"${CURL_TLS_ARGS[@]}"} -X POST \
            -H "X-Kermesse-Bootstrap-Token: ${BOOTSTRAP_ACTIVATE_TOKEN}" \
            -w "%{http_code}" -o "${activate_response_body}" \
            "${ACTIVATE_URL}")

          if [ -s "${activate_response_body}" ]; then
            cat "${activate_response_body}" >&2
            printf '\n' >&2
          fi

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::L'activation autonome a échoué (HTTP $HTTP_CODE)."
            exit 1
          fi

          echo "Activation réussie avec succès !"

      - name: Cleanup bootstrap script from server
        if: always()
        run: |
          set -euo pipefail

          lftp_quote() {
            local value="$1"
            value="${value//\\/\\\\}"
            value="${value//\"/\\\"}"
            printf '"%s"' "${value}"
          }

          remote_script="${OUVATON_HTTPDOCS_FOLDER}/ops-bootstrap-activate.php"

          echo "Suppression du script d'activation temporaire sur le serveur..."
          {
            printf 'set cmd:fail-exit no\n'
            printf 'set net:max-retries 2\n'
            printf 'set net:timeout 30\n'
            printf 'open -u %s,%s -p 115 sftp://%s\n' \
              "$(lftp_quote "${OUVATON_DEPLOY_USERNAME}")" \
              "$(lftp_quote "${OUVATON_DEPLOY_PASSWORD}")" \
              "${OUVATON_DEPLOY_HOST}"
            printf 'rm %s\n' "$(lftp_quote "${remote_script}")"
            printf 'bye\n'
          } | lftp || { echo "::error::Impossible de supprimer le script temporaire."; exit 1; }

      - name: Run post-deploy migrations
        env:
          # ops-sign.sh attend OPS_HMAC_SECRET ; on y mappe le secret de migration.
          OPS_HMAC_SECRET: ${{ secrets.OPS_MIGRATION_HMAC_SECRET }}
        run: |
          set -euo pipefail
          # MÊME signature qu'en répétition (scripts/deploy-rehearsal.sh) — source unique (FR-18).
          source scripts/lib/ops-sign.sh

          # Sanitize BASE_URL by stripping any trailing slashes
          BASE_URL="$(echo "${KERMESSE_PUBLIC_BASE_URL}" | sed 's:/*$::')"
          ALLOW_INSECURE_TLS="${KERMESSE_ALLOW_INSECURE_TLS:-false}"

          if [ -z "$BASE_URL" ] || [ -z "${OPS_HMAC_SECRET:-}" ]; then
            echo "::error::KERMESSE_PUBLIC_BASE_URL et OPS_MIGRATION_HMAC_SECRET sont requis."
            exit 1
          fi
          ops_require_https_endpoint "$BASE_URL" 32

          ROUTE="ops/migrate"
          BODY='{}'
          ops_sign "$ROUTE" "$BODY"

          CURL_TLS_ARGS=()
          if [[ "${ALLOW_INSECURE_TLS,,}" == "true" ]]; then
            echo "::warning::KERMESSE_ALLOW_INSECURE_TLS=true : vérification TLS désactivée pour les migrations. À retirer dès que le certificat de production est valide."
            CURL_TLS_ARGS+=(--insecure)
          fi

          # curl -fsS : -f échoue sur HTTP 4xx/5xx (failed > 0 ou code ≠ 200 ⇒ job rouge).
          HTTP_CODE=$(curl --max-time 300 --retry 3 -fsS ${CURL_TLS_ARGS[@]:+"${CURL_TLS_ARGS[@]}"} -X POST "${BASE_URL}/${ROUTE}" \
            -H "Content-Type: application/json" \
            -H "X-Kermesse-Timestamp: ${SIGN_TS}" \
            -H "X-Kermesse-Nonce: ${SIGN_NONCE}" \
            -H "X-Kermesse-Signature: ${SIGN_SIG}" \
            -w "%{http_code}" -o /dev/stderr \
            -d "$BODY")

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Webhook échoué ou redirigé (HTTP $HTTP_CODE). L'URL ne doit pas déclencher de redirection 3xx."
            exit 1
          fi

      - name: Fetch production log tail on deploy failure
        if: failure()
        run: |
          set -euo pipefail

          lftp_quote() {
            local value="$1"
            value="${value//\\/\\\\}"
            value="${value//\"/\\\"}"
            printf '"%s"' "${value}"
          }

          requested_date="$(date -u +%F)"
          download_dir="${RUNNER_TEMP:-/tmp}/ouvaton-logs"
          raw_log="${download_dir}/log-${requested_date}"
          remote_log_base="${OUVATON_DEPLOY_REMOTE_FOLDER}/shared/writable/logs/log-${requested_date}"
          mkdir -p "${download_dir}"

          fetched_log=""
          for extension in log php; do
            remote_log="${remote_log_base}.${extension}"
            candidate_log="${raw_log}.${extension}"

            if {
              printf 'set cmd:fail-exit yes\n'
              printf 'set net:max-retries 2\n'
              printf 'set net:timeout 30\n'
              printf 'open -u %s,%s -p 115 sftp://%s\n' \
                "$(lftp_quote "${OUVATON_DEPLOY_USERNAME}")" \
                "$(lftp_quote "${OUVATON_DEPLOY_PASSWORD}")" \
                "${OUVATON_DEPLOY_HOST}"
              printf 'get %s -o %s\n' "$(lftp_quote "${remote_log}")" "$(lftp_quote "${candidate_log}")"
              printf 'bye\n'
            } | lftp; then
              if [ -s "${candidate_log}" ]; then
                fetched_log="${candidate_log}"
                echo "::group::Production application log tail (${remote_log})"
                tail -n 120 "${fetched_log}" || true
                echo "::endgroup::"
                break
              fi
            fi
          done

          if [ -z "${fetched_log}" ]; then
            echo "::warning::Aucun log applicatif récupéré (${remote_log_base}.log ou ${remote_log_base}.php)."
          fi
