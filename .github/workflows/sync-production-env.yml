name: Sync production .env to Ouvaton

on:
  workflow_dispatch:
    inputs:
      confirm_first_install_env:
        description: 'Confirm that no production .env exists yet on Ouvaton.'
        required: false
        type: boolean
        default: false

concurrency:
  group: production-env-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-production-env:
    runs-on: ubuntu-latest
    environment: production

    env:
      # --- Variables (non-sensitive configuration) ---
      OUVATON_DEPLOY_HOST: ${{ vars.OUVATON_DEPLOY_HOST }}
      OUVATON_DEPLOY_USERNAME: ${{ vars.OUVATON_DEPLOY_USERNAME }}
      OUVATON_DEPLOY_REMOTE_FOLDER: ${{ vars.OUVATON_DEPLOY_REMOTE_FOLDER }}
      KERMESSE_OUVATON_ROOT: ${{ vars.KERMESSE_OUVATON_ROOT }}
      KERMESSE_PUBLIC_BASE_URL: ${{ vars.KERMESSE_PUBLIC_BASE_URL }}
      KERMESSE_APP_TIMEZONE: ${{ vars.KERMESSE_APP_TIMEZONE }}
      KERMESSE_DATABASE_HOSTNAME: ${{ vars.KERMESSE_DATABASE_HOSTNAME }}
      KERMESSE_DATABASE_DATABASE: ${{ vars.KERMESSE_DATABASE_DATABASE }}
      KERMESSE_DATABASE_USERNAME: ${{ vars.KERMESSE_DATABASE_USERNAME }}
      KERMESSE_EMAIL_SMTP_HOST: ${{ vars.KERMESSE_EMAIL_SMTP_HOST }}
      KERMESSE_EMAIL_SMTP_USER: ${{ vars.KERMESSE_EMAIL_SMTP_USER }}
      KERMESSE_EMAIL_SMTP_PORT: ${{ vars.KERMESSE_EMAIL_SMTP_PORT }}
      KERMESSE_EMAIL_SMTP_CRYPTO: ${{ vars.KERMESSE_EMAIL_SMTP_CRYPTO }}
      KERMESSE_EMAIL_FROM_EMAIL: ${{ vars.KERMESSE_EMAIL_FROM_EMAIL }}
      KERMESSE_EMAIL_FROM_NAME: ${{ vars.KERMESSE_EMAIL_FROM_NAME }}
      # --- Secrets (sensitive credentials) ---
      OUVATON_DEPLOY_PASSWORD: ${{ secrets.OUVATON_DEPLOY_PASSWORD }}
      KERMESSE_DATABASE_PASSWORD: ${{ secrets.KERMESSE_DATABASE_PASSWORD }}
      KERMESSE_EMAIL_SMTP_PASS: ${{ secrets.KERMESSE_EMAIL_SMTP_PASS }}
      KERMESSE_TOKEN_SECRET: ${{ secrets.KERMESSE_TOKEN_SECRET }}
      OPS_MIGRATION_HMAC_SECRET: ${{ secrets.OPS_MIGRATION_HMAC_SECRET }}
      CONFIRM_FIRST_INSTALL_ENV: ${{ inputs.confirm_first_install_env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install transfer client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Generate .env.next from production variables and secrets
        shell: bash
        run: |
          set -euo pipefail

          # Non-sensitive configuration — set as GitHub Actions Variables.
          required_vars=(
            OUVATON_DEPLOY_HOST
            OUVATON_DEPLOY_USERNAME
            OUVATON_DEPLOY_REMOTE_FOLDER
            KERMESSE_OUVATON_ROOT
            KERMESSE_PUBLIC_BASE_URL
            KERMESSE_DATABASE_HOSTNAME
            KERMESSE_DATABASE_DATABASE
            KERMESSE_DATABASE_USERNAME
            KERMESSE_EMAIL_SMTP_HOST
            KERMESSE_EMAIL_SMTP_USER
            KERMESSE_EMAIL_FROM_EMAIL
          )

          # Sensitive credentials — set as GitHub Actions Secrets.
          required_secrets=(
            OUVATON_DEPLOY_PASSWORD
            KERMESSE_DATABASE_PASSWORD
            KERMESSE_EMAIL_SMTP_PASS
            KERMESSE_TOKEN_SECRET
            OPS_MIGRATION_HMAC_SECRET
          )

          missing=0
          for name in "${required_vars[@]}"; do
            value="${!name:-}"
            if [ -z "${value//[[:space:]]/}" ]; then
              echo "::error::Missing required production variable: ${name}"
              missing=1
            fi
          done
          for name in "${required_secrets[@]}"; do
            value="${!name:-}"
            if [ -z "${value//[[:space:]]/}" ]; then
              echo "::error::Missing required production secret: ${name}"
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

          reject_multiline_value() {
            local name="$1"
            local value="${!name:-}"
            if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "::error::Production value must be single-line: ${name}"
              exit 1
            fi
          }

          reject_dotenv_nested_reference() {
            local name="$1"
            local value="${!name:-}"
            if [[ "${value}" =~ \$\{[A-Za-z0-9_.]+\} ]]; then
              echo "::error::Production value must not contain dotenv nested-variable syntax: ${name}"
              exit 1
            fi
          }

          all_inputs=("${required_vars[@]}" "${required_secrets[@]}" KERMESSE_APP_TIMEZONE)
          for name in "${all_inputs[@]}"; do
            reject_multiline_value "${name}"
            reject_dotenv_nested_reference "${name}"
          done

          if [ "${#KERMESSE_TOKEN_SECRET}" -lt 32 ]; then
            echo "::error::KERMESSE_TOKEN_SECRET must be at least 32 characters"
            exit 1
          fi

          if [ "${#OPS_MIGRATION_HMAC_SECRET}" -lt 32 ]; then
            echo "::error::OPS_MIGRATION_HMAC_SECRET must be at least 32 characters"
            exit 1
          fi

          escape_dotenv_value() {
            local value="$1"
            value="${value//\\/\\\\}"
            value="${value//\"/\\\"}"
            printf '%s' "${value}"
          }

          write_raw() {
            printf '%s = %s\n' "$1" "$2"
          }

          write_quoted() {
            printf '%s = "%s"\n' "$1" "$(escape_dotenv_value "$2")"
          }

          env_next="${RUNNER_TEMP}/.env.next"
          umask 077

          {
            printf '# Generated by GitHub Actions from the production environment variables and secrets.\n'
            printf '# Do not commit this file, upload it as an artifact, or print its contents.\n\n'

            write_raw CI_ENVIRONMENT production
            write_quoted app.baseURL "${KERMESSE_PUBLIC_BASE_URL}"
            write_quoted app.appTimezone "${KERMESSE_APP_TIMEZONE:-Europe/Paris}"
            write_raw app.forceGlobalSecureRequests true
            write_raw app.CSPEnabled false
            write_raw logger.threshold 4
            write_quoted kermesse.publicBaseURL "${KERMESSE_PUBLIC_BASE_URL}"

            printf '\n'
            write_quoted database.default.hostname "${KERMESSE_DATABASE_HOSTNAME}"
            write_quoted database.default.database "${KERMESSE_DATABASE_DATABASE}"
            write_quoted database.default.username "${KERMESSE_DATABASE_USERNAME}"
            write_quoted database.default.password "${KERMESSE_DATABASE_PASSWORD}"
            write_raw database.default.DBDriver MySQLi
            write_raw database.default.DBPrefix ''
            write_raw database.default.port 3306
            write_raw database.default.charset utf8mb4
            write_raw database.default.DBCollat utf8mb4_general_ci

            printf '\n'
            write_quoted session.driver 'CodeIgniter\Session\Handlers\FileHandler'
            write_quoted session.savePath "${KERMESSE_OUVATON_ROOT}/${OUVATON_DEPLOY_REMOTE_FOLDER}/writable/session"
            write_quoted session.cookieName kermesse_session
            write_raw session.expiration 7200
            write_raw session.matchIP false
            write_raw session.timeToUpdate 300
            write_raw session.regenerateDestroy false
            write_raw cookie.prefix ''
            write_raw cookie.expires 0
            write_quoted cookie.path /
            write_raw cookie.domain ''
            write_raw cookie.secure true
            write_raw cookie.httponly true
            write_quoted cookie.samesite Lax

            printf '\n'
            write_raw email.protocol smtp
            write_quoted email.SMTPHost "${KERMESSE_EMAIL_SMTP_HOST}"
            write_quoted email.SMTPUser "${KERMESSE_EMAIL_SMTP_USER}"
            write_quoted email.SMTPPass "${KERMESSE_EMAIL_SMTP_PASS}"
            write_raw email.SMTPPort "${KERMESSE_EMAIL_SMTP_PORT:-587}"
            write_quoted email.SMTPCrypto "${KERMESSE_EMAIL_SMTP_CRYPTO:-tls}"
            write_quoted email.fromEmail "${KERMESSE_EMAIL_FROM_EMAIL}"
            write_quoted email.fromName "${KERMESSE_EMAIL_FROM_NAME:-Kermesse}"

            printf '\n'
            write_quoted kermesse.tokenSecret "${KERMESSE_TOKEN_SECRET}"
            write_raw kermesse.ownerValidationTokenTTL 86400
            write_raw kermesse.ownerLoginTokenTTL 900
            write_raw kermesse.volunteerManagementTokenTTL 1209600

            printf '\n'
            write_quoted kermesse.opsMigrationHmacSecret "${OPS_MIGRATION_HMAC_SECRET}"
            write_raw kermesse.opsMigrationAllowedTimestampSkew 300
            write_raw kermesse.opsMigrationNonceTTL 600
            write_raw kermesse.opsMigrationProductionOnly true
            write_quoted kermesse.opsMigrationLockName kermesse_ops_migration_lock

            printf '\n'
            write_quoted kermesse.deployTarget ouvaton
            write_quoted kermesse.deployProtocol ftps
            write_quoted kermesse.deployHost "${OUVATON_DEPLOY_HOST}"
            write_quoted kermesse.deployRemotePath "${KERMESSE_OUVATON_ROOT}/${OUVATON_DEPLOY_REMOTE_FOLDER}"
            write_raw kermesse.deployPreserveEnv true
          } > "${env_next}"

          echo "Generated .env.next in the runner temp directory."

      - name: Upload .env.next, backup current .env, and activate
        shell: bash
        run: |
          set -euo pipefail

          env_next="${RUNNER_TEMP}/.env.next"
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          local_backup="${RUNNER_TEMP}/.env.backup-${timestamp}"
          remote_backup=".env.backup-${timestamp}"
          remote_previous=".env.previous-${timestamp}"
          remote_candidate_uploaded=0

          cleanup_remote_candidate() {
            if [ "${remote_candidate_uploaded}" -eq 1 ]; then
              run_lftp "rm .env.next" >/dev/null 2>&1 || true
            fi
          }

          trap 'cleanup_remote_candidate; rm -f "${env_next}" "${local_backup}"' EXIT

          if [ ! -s "${env_next}" ]; then
            echo "::error::.env.next was not generated"
            exit 1
          fi

          lftp_quote() {
            local value="$1"
            value="${value//\\/\\\\}"
            value="${value//\"/\\\"}"
            printf '"%s"' "${value}"
          }

          lftp_settings() {
            printf 'set cmd:fail-exit yes\n'
            printf 'set net:max-retries 2\n'
            printf 'set net:timeout 30\n'
            printf 'set ssl:verify-certificate yes\n'
            printf 'set ftp:ssl-force yes\n'
            printf 'set ftp:ssl-protect-data yes\n'
          }

          run_lftp() {
            local commands="$1"
            {
              lftp_settings
              printf 'open %s\n' "$(lftp_quote "ftps://${OUVATON_DEPLOY_HOST}")"
              printf 'user %s %s\n' "$(lftp_quote "${OUVATON_DEPLOY_USERNAME}")" "$(lftp_quote "${OUVATON_DEPLOY_PASSWORD}")"
              printf 'cd %s\n' "$(lftp_quote "${OUVATON_DEPLOY_REMOTE_FOLDER}")"
              printf '%s\n' "${commands}"
              printf 'bye\n'
            } | lftp
          }

          run_lftp "put $(lftp_quote "${env_next}") -o .env.next"
          remote_candidate_uploaded=1
          echo "Uploaded .env.next to Ouvaton."

          if run_lftp "cls -1 .env" >/dev/null 2>&1; then
            run_lftp "get .env -o $(lftp_quote "${local_backup}")"
            run_lftp "put $(lftp_quote "${local_backup}") -o ${remote_backup}"
            echo "Backed up current .env on Ouvaton as ${remote_backup}."
            backup_exists=1
          else
            if [ "${CONFIRM_FIRST_INSTALL_ENV}" != "true" ]; then
              echo "::error::Could not confirm the absence of .env. Re-run with confirm_first_install_env=true only for first installation."
              exit 1
            fi

            echo "No current .env backup was created; first installation was explicitly confirmed."
            backup_exists=0
          fi

          old_env_moved=0
          if [ "${backup_exists}" -eq 1 ]; then
            run_lftp "mv .env ${remote_previous}"
            old_env_moved=1
          fi

          if run_lftp "mv .env.next .env"; then
            echo "Activated .env.next as .env on Ouvaton."
          else
            echo "::error::Failed to activate .env.next as .env."

            if [ "${old_env_moved}" -eq 1 ]; then
              echo "Attempting rollback to the previous .env."
              if ! run_lftp "mv ${remote_previous} .env"; then
                echo "Restoring .env from the local backup copy."
                run_lftp "put $(lftp_quote "${local_backup}") -o .env"
              fi
            fi

            exit 1
          fi

          remote_candidate_uploaded=0

          if [ "${old_env_moved}" -eq 1 ]; then
            run_lftp "rm ${remote_previous}"
          fi

          if [ "${backup_exists}" -eq 1 ]; then
            echo "Production .env sync completed. Backup: ${remote_backup}"
          else
            echo "Production .env sync completed. No previous .env backup was created."
          fi
