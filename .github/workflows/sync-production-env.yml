name: Sync production .env to Ouvaton

on:
  workflow_dispatch:

concurrency:
  group: production-env-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-production-env:
    runs-on: ubuntu-latest
    environment: production

    env:
      # --- Configuration non-sensible (GitHub environment variables) ---
      # Ces valeurs sont visibles dans les logs et l'UI GitHub.
      OUVATON_DEPLOY_HOST: ${{ vars.OUVATON_DEPLOY_HOST }}
      OUVATON_DEPLOY_USERNAME: ${{ vars.OUVATON_DEPLOY_USERNAME }}
      OUVATON_DEPLOY_REMOTE_FOLDER: ${{ vars.OUVATON_DEPLOY_REMOTE_FOLDER }}
      KERMESSE_OUVATON_ROOT: ${{ vars.KERMESSE_OUVATON_ROOT }}
      KERMESSE_PUBLIC_BASE_URL: ${{ vars.KERMESSE_PUBLIC_BASE_URL }}
      KERMESSE_DATABASE_HOSTNAME: ${{ vars.KERMESSE_DATABASE_HOSTNAME }}
      KERMESSE_DATABASE_DATABASE: ${{ vars.KERMESSE_DATABASE_DATABASE }}
      KERMESSE_DATABASE_USERNAME: ${{ vars.KERMESSE_DATABASE_USERNAME }}
      KERMESSE_EMAIL_SMTP_HOST: ${{ vars.KERMESSE_EMAIL_SMTP_HOST }}
      KERMESSE_EMAIL_SMTP_USER: ${{ vars.KERMESSE_EMAIL_SMTP_USER }}
      KERMESSE_EMAIL_FROM_EMAIL: ${{ vars.KERMESSE_EMAIL_FROM_EMAIL }}
      # Optionnels — défauts appliqués dans le script si absents.
      KERMESSE_APP_TIMEZONE: ${{ vars.KERMESSE_APP_TIMEZONE }}
      KERMESSE_EMAIL_FROM_NAME: ${{ vars.KERMESSE_EMAIL_FROM_NAME }}
      KERMESSE_EMAIL_SMTP_PORT: ${{ vars.KERMESSE_EMAIL_SMTP_PORT }}
      KERMESSE_EMAIL_SMTP_CRYPTO: ${{ vars.KERMESSE_EMAIL_SMTP_CRYPTO }}
      # Probe runtime — activer temporairement pour lire ssl_context via POST /ops/probe.
      # Valeur : true | false (défaut false si absent). Ne pas laisser true en permanence.
      KERMESSE_OPS_PROBE_ENABLED: ${{ vars.KERMESSE_OPS_PROBE_ENABLED }}
      # --- Credentials sensibles (GitHub environment secrets) ---
      # Ces valeurs sont masquées dans tous les logs GitHub Actions.
      OUVATON_DEPLOY_PASSWORD: ${{ secrets.OUVATON_DEPLOY_PASSWORD }}
      # Known-hosts SFTP Ouvaton — obtenu via : ssh-keyscan -p 115 <host>
      OUVATON_SFTP_KNOWN_HOST: ${{ secrets.OUVATON_SFTP_KNOWN_HOST }}
      KERMESSE_DATABASE_PASSWORD: ${{ secrets.KERMESSE_DATABASE_PASSWORD }}
      KERMESSE_EMAIL_SMTP_PASS: ${{ secrets.KERMESSE_EMAIL_SMTP_PASS }}
      KERMESSE_TOKEN_SECRET: ${{ secrets.KERMESSE_TOKEN_SECRET }}
      OPS_MIGRATION_HMAC_SECRET: ${{ secrets.OPS_MIGRATION_HMAC_SECRET }}

    steps:
      - name: Install transfer client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Validate configuration and generate .env.next
        # Écrit dans ${RUNNER_TEMP}/.env.next — jamais affiché, jamais uploadé comme artefact.
        # Les valeurs sensibles sont passées comme arguments à printf, pas via echo.
        shell: bash
        run: |
          set -euo pipefail

          # Liste des variables requises (non-optionnelles).
          # Inclut à la fois la configuration non-sensible et les credentials.
          required_vars=(
            OUVATON_DEPLOY_HOST
            OUVATON_DEPLOY_USERNAME
            OUVATON_DEPLOY_REMOTE_FOLDER
            KERMESSE_OUVATON_ROOT
            KERMESSE_PUBLIC_BASE_URL
            KERMESSE_DATABASE_HOSTNAME
            KERMESSE_DATABASE_DATABASE
            KERMESSE_DATABASE_USERNAME
            KERMESSE_EMAIL_SMTP_HOST
            KERMESSE_EMAIL_SMTP_USER
            KERMESSE_EMAIL_FROM_EMAIL
            OUVATON_DEPLOY_PASSWORD
            OUVATON_SFTP_KNOWN_HOST
            KERMESSE_DATABASE_PASSWORD
            KERMESSE_EMAIL_SMTP_PASS
            KERMESSE_TOKEN_SECRET
            OPS_MIGRATION_HMAC_SECRET
          )

          # AC-2 : échec avant transfert si une variable requise est absente.
          # Seul le nom logique de la variable est affiché — jamais sa valeur.
          missing=0
          for var_name in "${required_vars[@]}"; do
            var_value="${!var_name:-}"
            var_stripped="${var_value//[[:space:]]/}"
            if [ -z "${var_stripped}" ]; then
              echo "::error::Missing required production configuration: ${var_name}"
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

          # Refus des valeurs multi-lignes (risque d'injection dotenv).
          reject_multiline() {
            local name="$1"
            local value="${!name:-}"
            if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "::error::Production configuration must be single-line: ${name}"
              exit 1
            fi
          }

          optional_vars=(
            KERMESSE_APP_TIMEZONE
            KERMESSE_EMAIL_FROM_NAME
            KERMESSE_EMAIL_SMTP_PORT
            KERMESSE_EMAIL_SMTP_CRYPTO
            KERMESSE_OPS_PROBE_ENABLED
          )
          for var_name in "${required_vars[@]}" "${optional_vars[@]}"; do
            reject_multiline "${var_name}"
          done

          # Refus des références dotenv imbriquées (${...}) dans les valeurs.
          reject_dotenv_nested_reference() {
            local name="$1"
            local value="${!name:-}"
            if [[ "${value}" =~ \$\{[A-Za-z0-9_.]+\} ]]; then
              echo "::error::Production configuration must not contain dotenv nested-variable syntax: ${name}"
              exit 1
            fi
          }

          non_credential_vars=(
            OUVATON_DEPLOY_HOST
            OUVATON_DEPLOY_USERNAME
            OUVATON_DEPLOY_REMOTE_FOLDER
            KERMESSE_OUVATON_ROOT
            KERMESSE_PUBLIC_BASE_URL
            KERMESSE_DATABASE_HOSTNAME
            KERMESSE_DATABASE_DATABASE
            KERMESSE_DATABASE_USERNAME
            KERMESSE_EMAIL_SMTP_HOST
            KERMESSE_EMAIL_SMTP_USER
            KERMESSE_EMAIL_FROM_EMAIL
            KERMESSE_APP_TIMEZONE
            KERMESSE_EMAIL_FROM_NAME
          )
          for var_name in "${non_credential_vars[@]}"; do
            reject_dotenv_nested_reference "${var_name}"
          done

          # Validation des formats numériques.
          smtp_port="${KERMESSE_EMAIL_SMTP_PORT:-587}"
          if [[ -n "${KERMESSE_EMAIL_SMTP_PORT:-}" ]]; then
            # Valider une vraie plage de port TCP (1-65535), pas seulement « des chiffres ».
            # La comparaison arithmétique n'est atteinte qu'après le test ^[0-9]+$ (short-circuit) :
            # une valeur non numérique est rejetée d'abord, sans évaluer -lt/-gt.
            if [[ ! "${KERMESSE_EMAIL_SMTP_PORT}" =~ ^[0-9]+$ ]] \
               || [ "${KERMESSE_EMAIL_SMTP_PORT}" -lt 1 ] \
               || [ "${KERMESSE_EMAIL_SMTP_PORT}" -gt 65535 ]; then
              echo "::error::KERMESSE_EMAIL_SMTP_PORT must be an integer between 1 and 65535"
              exit 1
            fi
          fi

          # Validation de la longueur minimale des clés cryptographiques.
          if [ "${#KERMESSE_TOKEN_SECRET}" -lt 32 ]; then
            echo "::error::KERMESSE_TOKEN_SECRET must be at least 32 characters"
            exit 1
          fi

          if [ "${#OPS_MIGRATION_HMAC_SECRET}" -lt 32 ]; then
            echo "::error::OPS_MIGRATION_HMAC_SECRET must be at least 32 characters"
            exit 1
          fi

          # Dériver les valeurs composées depuis la configuration.
          # session.savePath = chemin absolu filesystem persistant hors release.
          session_save_path="${KERMESSE_OUVATON_ROOT}/${OUVATON_DEPLOY_REMOTE_FOLDER}/shared/writable/session"
          # deploy path = chemin absolu filesystem de l'application déployée.
          deploy_remote_path="${KERMESSE_OUVATON_ROOT}/${OUVATON_DEPLOY_REMOTE_FOLDER}"

          # Valeurs optionnelles avec défauts.
          app_timezone="${KERMESSE_APP_TIMEZONE:-Europe/Paris}"
          email_from_name="${KERMESSE_EMAIL_FROM_NAME:-Kermesse}"
          smtp_crypto="${KERMESSE_EMAIL_SMTP_CRYPTO:-tls}"

          # Helpers d'écriture dotenv.
          # Les valeurs sensibles sont passées comme arguments à printf — jamais dans
          # une substitution de commande qui serait tracée dans les logs.
          escape_dotenv_value() {
            local value="$1"
            value="${value//\\/\\\\}"
            value="${value//\"/\\\"}"
            printf '%s' "${value}"
          }

          write_raw() {
            printf '%s = %s\n' "$1" "$2"
          }

          write_quoted() {
            printf '%s = "%s"\n' "$1" "$(escape_dotenv_value "$2")"
          }

          env_next="${RUNNER_TEMP}/.env.next"
          umask 077

          {
            printf '# Generated by GitHub Actions sync-production-env workflow.\n'
            printf '# Source of truth : environment GitHub "production".\n'
            printf '# Do not commit, print, upload as artifact, or store this file.\n\n'

            write_raw CI_ENVIRONMENT production
            write_quoted app.baseURL "${KERMESSE_PUBLIC_BASE_URL}"
            write_quoted app.appTimezone "${app_timezone}"
            write_raw app.forceGlobalSecureRequests true
            write_raw app.CSPEnabled false
            write_raw logger.threshold 4
            write_quoted kermesse.publicBaseURL "${KERMESSE_PUBLIC_BASE_URL}"

            printf '\n'
            write_quoted database.default.hostname "${KERMESSE_DATABASE_HOSTNAME}"
            write_quoted database.default.database "${KERMESSE_DATABASE_DATABASE}"
            write_quoted database.default.username "${KERMESSE_DATABASE_USERNAME}"
            write_quoted database.default.password "${KERMESSE_DATABASE_PASSWORD}"
            write_raw database.default.DBDriver MySQLi
            write_raw database.default.DBPrefix ''
            write_raw database.default.port 3306
            write_raw database.default.charset utf8mb4
            write_raw database.default.DBCollat utf8mb4_general_ci

            printf '\n'
            write_quoted session.driver 'CodeIgniter\Session\Handlers\FileHandler'
            write_quoted session.savePath "${session_save_path}"
            write_quoted session.cookieName kermesse_session
            write_raw session.expiration 7200
            write_raw session.matchIP false
            write_raw session.timeToUpdate 300
            write_raw session.regenerateDestroy false
            write_raw cookie.prefix ''
            write_raw cookie.expires 0
            write_quoted cookie.path /
            write_raw cookie.domain ''
            write_raw cookie.secure true
            write_raw cookie.httponly true
            write_quoted cookie.samesite Lax

            printf '\n'
            write_raw email.protocol smtp
            write_quoted email.SMTPHost "${KERMESSE_EMAIL_SMTP_HOST}"
            write_quoted email.SMTPUser "${KERMESSE_EMAIL_SMTP_USER}"
            write_quoted email.SMTPPass "${KERMESSE_EMAIL_SMTP_PASS}"
            write_raw email.SMTPPort "${smtp_port}"
            write_quoted email.SMTPCrypto "${smtp_crypto}"
            write_quoted email.fromEmail "${KERMESSE_EMAIL_FROM_EMAIL}"
            write_quoted email.fromName "${email_from_name}"

            printf '\n'
            write_quoted kermesse.tokenSecret "${KERMESSE_TOKEN_SECRET}"
            write_raw kermesse.ownerValidationTokenTTL 86400
            write_raw kermesse.ownerLoginTokenTTL 900
            write_raw kermesse.volunteerManagementTokenTTL 1209600

            printf '\n'
            write_quoted kermesse.opsMigrationHmacSecret "${OPS_MIGRATION_HMAC_SECRET}"
            write_raw kermesse.opsMigrationAllowedTimestampSkew 300
            write_raw kermesse.opsMigrationNonceTTL 600
            write_raw kermesse.opsMigrationProductionOnly true
            write_quoted kermesse.opsMigrationLockName kermesse_ops_migration_lock

            printf '\n'
            # Chemin explicite du layout atomique Ouvaton.
            # Ne pas dépendre de ROOTPATH : PHP résout current/ vers releases/<id>/.
            write_quoted kermesse.opsActivateBasePath "${deploy_remote_path}"
            write_quoted kermesse.opsActivateLockName kermesse_ops_activate_lock
            write_raw kermesse.releasesRetention 3

            # Probe : false par défaut, true si la variable GitHub KERMESSE_OPS_PROBE_ENABLED=true.
            # N'écrire que si la valeur est explicitement "true" pour éviter toute activation accidentelle.
            if [[ "${KERMESSE_OPS_PROBE_ENABLED:-}" == "true" ]]; then
              write_raw kermesse.opsProbeEnabled true
            else
              write_raw kermesse.opsProbeEnabled false
            fi

            printf '\n'
            write_quoted kermesse.deployTarget ouvaton
            # Protocole fixé à sftp sur Ouvaton (port 115).
            write_raw kermesse.deployProtocol sftp
            write_quoted kermesse.deployHost "${OUVATON_DEPLOY_HOST}"
            write_quoted kermesse.deployRemotePath "${deploy_remote_path}"
            write_raw kermesse.deployPreserveEnv true
          } > "${env_next}"

          echo "Generated .env.next in the runner temp directory."

      - name: Upload .env.next to shared/, backup and activate atomically
        # AC-1 : génère .env.next, sauvegarde shared/.env, remplace atomiquement.
        # AC-4 : première installation sans backup (détection automatique).
        # Aucune valeur secrète n'apparaît dans les logs.
        shell: bash
        run: |
          set -euo pipefail

          env_next="${RUNNER_TEMP}/.env.next"
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          local_backup="${RUNNER_TEMP}/.env.backup-${timestamp}"
          remote_backup=".env.backup-${timestamp}"
          remote_previous=".env.previous-${timestamp}"
          known_hosts_file="${RUNNER_TEMP}/ouvaton_known_hosts"
          remote_candidate_uploaded=0

          # Nettoyage : retirer .env.next distant si l'activation a échoué avant rename.
          cleanup_remote_candidate() {
            if [ "${remote_candidate_uploaded}" -eq 1 ]; then
              run_lftp "rm .env.next" >/dev/null 2>&1 || true
            fi
          }

          trap 'cleanup_remote_candidate; rm -f "${env_next}" "${local_backup}" "${known_hosts_file}"' EXIT

          if [ ! -s "${env_next}" ]; then
            echo "::error::.env.next was not generated or is empty"
            exit 1
          fi

          # Écrire les known_hosts SFTP dans un fichier temporaire à mode restreint.
          umask 077
          printf '%s\n' "${OUVATON_SFTP_KNOWN_HOST}" > "${known_hosts_file}"

          lftp_quote() {
            local value="$1"
            value="${value//\\/\\\\}"
            value="${value//\"/\\\"}"
            printf '"%s"' "${value}"
          }

          # Paramètres lftp communs : SFTP port 115, StrictHostKeyChecking activé.
          # GlobalKnownHostsFile=/dev/null : seul le known_hosts épinglé (UserKnownHostsFile)
          # fait autorité ; on neutralise /etc/ssh/ssh_known_hosts pour éviter toute
          # interférence d'une entrée globale du runner sur la vérification de la clé hôte.
          lftp_settings() {
            printf 'set cmd:fail-exit yes\n'
            printf 'set net:max-retries 2\n'
            printf 'set net:timeout 30\n'
            printf 'set ssl:verify-certificate yes\n'
            printf 'set sftp:connect-program %s\n' \
              "$(lftp_quote "ssh -a -x -o BatchMode=no -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=${known_hosts_file}")"
          }

          # run_lftp : ouvre une session SFTP dans shared/ et exécute les commandes passées.
          run_lftp() {
            local commands="$1"
            {
              lftp_settings
              printf 'open %s\n' "$(lftp_quote "sftp://${OUVATON_DEPLOY_HOST}:115")"
              printf 'user %s %s\n' \
                "$(lftp_quote "${OUVATON_DEPLOY_USERNAME}")" \
                "$(lftp_quote "${OUVATON_DEPLOY_PASSWORD}")"
              printf 'cd %s\n' "$(lftp_quote "${OUVATON_DEPLOY_REMOTE_FOLDER}/shared")"
              printf '%s\n' "${commands}"
              printf 'bye\n'
            } | lftp
          }

          # 0. S'assurer que le dossier shared/ existe sans déclencher l'erreur "File already exists" de lftp.
          # Si `run_lftp` réussit (le `cd` interne fonctionne), le dossier existe.
          # Sinon, on crée le dossier. Si l'échec initial était une vraie erreur réseau, ce bloc échouera aussi,
          # propageant l'erreur correctement grâce au set -e de bash.
          if ! run_lftp "pwd" >/dev/null 2>&1; then
            echo "Directory shared/ does not exist (or connection failed). Creating it..."
            {
              lftp_settings
              printf 'open %s\n' "$(lftp_quote "sftp://${OUVATON_DEPLOY_HOST}:115")"
              printf 'user %s %s\n' \
                "$(lftp_quote "${OUVATON_DEPLOY_USERNAME}")" \
                "$(lftp_quote "${OUVATON_DEPLOY_PASSWORD}")"
              printf 'cd %s\n' "$(lftp_quote "${OUVATON_DEPLOY_REMOTE_FOLDER}")"
              printf 'mkdir shared\n'
              printf 'bye\n'
            } | lftp
          else
            echo "Directory ${OUVATON_DEPLOY_REMOTE_FOLDER}/shared/ already exists on Ouvaton."
          fi

          # 1. Upload .env.next dans shared/.
          run_lftp "put $(lftp_quote "${env_next}") -o .env.next"
          remote_candidate_uploaded=1
          echo "Uploaded .env.next to Ouvaton shared/."

          # 2. Sauvegarder l'ancien shared/.env s'il existe.
          # On liste le contenu du dossier pour éviter les faux positifs d'erreur (timeout réseau masqué en "No such file").
          shared_ls=$(run_lftp "cls -1")
          if echo "${shared_ls}" | grep -qE "^\.env\r?$"; then
            run_lftp "get .env -o $(lftp_quote "${local_backup}")"
            run_lftp "put $(lftp_quote "${local_backup}") -o ${remote_backup}"
            echo "Backed up current shared/.env as shared/${remote_backup}."
            backup_exists=1
          else
            echo "No previous shared/.env found; treating as first installation — no backup created."
            backup_exists=0
          fi

          # 3. Déplacer l'ancien .env hors du chemin cible (si existant).
          old_env_moved=0
          if [ "${backup_exists}" -eq 1 ]; then
            run_lftp "mv .env ${remote_previous}"
            old_env_moved=1
          fi

          # 4. Activation atomique : renommer .env.next en .env.
          if run_lftp "mv .env.next .env"; then
            echo "Activated shared/.env.next as shared/.env on Ouvaton."
          else
            echo "::error::Failed to activate .env.next as shared/.env."

            # Rollback : restaurer l'ancien .env depuis la copie distante ou locale.
            if [ "${old_env_moved}" -eq 1 ]; then
              echo "Attempting rollback of shared/.env."
              if ! run_lftp "mv ${remote_previous} .env"; then
                echo "Remote rollback failed — restoring from local backup."
                # Dernier recours : si même ce put échoue, ne pas laisser set -e avorter
                # silencieusement — émettre une consigne de récupération manuelle explicite.
                # Les copies serveur subsistent : shared/${remote_previous} et shared/${remote_backup}.
                if ! run_lftp "put $(lftp_quote "${local_backup}") -o .env"; then
                  echo "::error::CRITIQUE : restauration automatique de shared/.env impossible en production."
                  echo "::error::Récupération manuelle requise sur Ouvaton ${OUVATON_DEPLOY_REMOTE_FOLDER}/shared/ : renommer ${remote_previous} (ou ${remote_backup}) en .env."
                fi
              fi
            fi

            exit 1
          fi

          # Activation réussie : .env.next n'existe plus sur le serveur.
          remote_candidate_uploaded=0

          # 5. Nettoyer le fichier temporaire de déplacement.
          if [ "${old_env_moved}" -eq 1 ]; then
            run_lftp "rm ${remote_previous}"
          fi

          if [ "${backup_exists}" -eq 1 ]; then
            echo "Production shared/.env sync completed. Backup available: shared/${remote_backup}"
          else
            echo "Production shared/.env sync completed (first installation — no backup)."
          fi
